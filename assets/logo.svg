<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AgentIsland Logo">
  <defs>
    <!-- Deep obsidian squircle backdrop -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171d29" />
      <stop offset="55%" stop-color="#0d1118" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Subtle top-left glass rim highlight -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#60a5fa" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.22" />
    </linearGradient>

    <!-- Ambient blue-emerald aura behind the Split Pill -->
    <radialGradient id="auraBlue" cx="38%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auraGreen" cx="76%" cy="52%" r="32%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>

    <!-- Main Agent Pill surface -->
    <linearGradient id="pillBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2536" />
      <stop offset="100%" stop-color="#0d1017" />
    </linearGradient>

    <!-- Antigravity levitating A gradient -->
    <linearGradient id="glyphGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="55%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Emerald posture progress arc gradient -->
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="10" y="10" width="236" height="236" rx="56" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="236" height="236" rx="56" fill="url(#auraBlue)" />
  <rect x="10" y="10" width="236" height="236" rx="56" fill="url(#auraGreen)" />
  <rect x="11.5" y="11.5" width="233" height="233" rx="54.5" fill="none" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- Subtle top-center dock indicator bar (hints at Windows top-edge anchor) -->
  <rect x="102" y="34" width="52" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.16" />

  <!-- LEFT: Agent Plane Primary Pill -->
  <rect x="34" y="92" width="124" height="72" rx="36" fill="url(#pillBg)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="3" />
  <!-- Crisp levitating A glyph inside left pill -->
  <path d="M62 143 L79 110 L96 143" fill="none" stroke="url(#glyphGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M69.5 133.5 Q79 125.5 88.5 133.5" fill="none" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />
  <!-- Live 3-bar Agent wave inside right side of left pill -->
  <rect x="112" y="122" width="5.5" height="14" rx="2.75" fill="#60a5fa" fill-opacity="0.72" />
  <rect x="122.5" y="113" width="5.5" height="32" rx="2.75" fill="#93c5fd" />
  <rect x="133" y="120" width="5.5" height="18" rx="2.75" fill="#60a5fa" fill-opacity="0.82" />

  <!-- RIGHT: Detached Split-Pill Posture & Timer Ring -->
  <circle cx="196" cy="128" r="28" fill="url(#pillBg)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2.5" />
  <!-- Background ring track -->
  <circle cx="196" cy="128" r="19" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="5.5" />
  <!-- Active emerald progress arc (~72% filled, starts at 12 o'clock) -->
  <path d="M196 109 A19 19 0 1 1 177.8 133.6" fill="none" stroke="url(#ringGrad)" stroke-width="5.5" stroke-linecap="round" />
  <!-- Center status core dot -->
  <circle cx="196" cy="128" r="4.5" fill="#4ade80" />
</svg>
