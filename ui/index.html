<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentIsland</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      color: #f4f4f5;
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 16px;
      background: transparent !important;
    }

    .dock {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
      background: transparent !important;
    }

    .dock.merged {
      gap: 0;
    }

    .island {
      position: relative;
      background: linear-gradient(180deg, rgba(19, 21, 28, 0.97) 0%, rgba(10, 11, 15, 0.98) 100%);
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.34),
        0 2px 4px rgba(0, 0, 0, 0.24),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
      overflow: hidden;
      width: 210px;
      height: 36px;
      border-radius: 18px;
      transition:
        width 340ms cubic-bezier(0.22, 1, 0.36, 1),
        height 340ms cubic-bezier(0.22, 1, 0.36, 1),
        border-radius 340ms cubic-bezier(0.22, 1, 0.36, 1),
        border-color 240ms ease,
        box-shadow 240ms ease;
      will-change: width, height, border-radius;
    }

    .island.compact-hover:hover {
      border-color: rgba(255, 255, 255, 0.32);
    }

    .island.glow-green {
      border-color: rgba(34, 197, 94, 0.68);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.36),
        0 0 10px rgba(34, 197, 94, 0.24),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
    }

    .island.glow-amber {
      border-color: rgba(245, 158, 11, 0.74);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.36),
        0 0 10px rgba(245, 158, 11, 0.26),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
    }

    .island.glow-blue {
      border-color: rgba(59, 130, 246, 0.68);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.36),
        0 0 10px rgba(59, 130, 246, 0.24),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
    }

    .island.glow-red {
      border-color: rgba(239, 68, 68, 0.76);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.36),
        0 0 10px rgba(239, 68, 68, 0.26),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
    }

    /* Right detached Split Pill Health Orb */
    .health-orb {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(19, 21, 28, 0.97) 0%, rgba(10, 11, 15, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.34),
        0 2px 4px rgba(0, 0, 0, 0.24),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      overflow: hidden;
      transition:
        width 260ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 200ms ease,
        transform 260ms cubic-bezier(0.22, 1, 0.36, 1),
        border-color 240ms ease,
        box-shadow 240ms ease;
    }

    .health-orb:hover {
      border-color: rgba(255, 255, 255, 0.35);
    }

    .health-orb.orb-alert {
      border-color: rgba(34, 197, 94, 0.78);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.36),
        0 0 10px rgba(34, 197, 94, 0.34);
    }

    .health-orb.hidden-orb {
      width: 0;
      opacity: 0;
      border-width: 0;
      box-shadow: none;
      pointer-events: none;
      transform: scale(0.7);
    }

    .orb-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .orb-label {
      position: relative;
      z-index: 1;
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f4f4f5;
      line-height: 1;
    }

    .content-enter {
      animation: fadeSoft 160ms ease-out;
    }

    @keyframes fadeSoft {
      from { opacity: 0.35; }
      to   { opacity: 1; }
    }

    @keyframes tickerIn {
      from { opacity: 0.25; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .ticker-text {
      animation: tickerIn 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.8); }
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-pulse {
      animation: pulseDot 1.35s ease-in-out infinite;
    }

    .brand-icon {
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    .brand-pulse {
      animation: pulseDot 1.45s ease-in-out infinite;
    }

    /* Minimal 3-bar live wave for working state (replaces bulky "思考中 / LIVE" text) */
    .wave-bars {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      height: 10px;
      flex-shrink: 0;
    }

    .wave-bars span {
      width: 2px;
      height: 4px;
      border-radius: 1px;
      background: #60a5fa;
      animation: wavePulse 1.1s ease-in-out infinite;
    }

    .wave-bars span:nth-child(2) { animation-delay: 0.18s; }
    .wave-bars span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes wavePulse {
      0%, 100% { height: 3px; opacity: 0.45; }
      50%      { height: 10px; opacity: 1; }
    }

    /* Compact Left Pill */
    .pill-bar {
      height: 36px;
      padding: 0 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      cursor: pointer;
    }

    .pill-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .pill-text {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .mini-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      line-height: 1.4;
    }

    .muted-tag {
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.52);
      font-variant-numeric: tabular-nums;
    }

    /* Expanded Cards */
    .card {
      padding: 13px 15px 13px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: grab;
    }

    .card-top:active {
      cursor: grabbing;
    }

    .card-top-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      flex-shrink: 0;
      border: 1px solid transparent;
    }

    .project-name {
      font-size: 12.5px;
      font-weight: 700;
      color: #fafafa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source-sub {
      font-size: 11px;
      font-weight: 500;
      color: #a1a1aa;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card-top-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .meta-text {
      font-size: 11px;
      color: #a1a1aa;
      font-variant-numeric: tabular-nums;
    }

    .icon-btn {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: none;
      background: rgba(255, 255, 255, 0.09);
      color: #d4d4d8;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 150ms, color 150ms;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .main-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .summary {
      font-size: 12.5px;
      color: #e4e4e7;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .toast-line {
      font-size: 11px;
      color: #fbbf24;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub-tip {
      font-size: 11.5px;
      color: #a1a1aa;
      line-height: 1.38;
      margin-top: 2px;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 2px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button.btn {
      border: none;
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 140ms, background 140ms;
      position: relative;
      overflow: hidden;
    }

    button.btn:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.13);
      color: #f4f4f5;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.07);
      color: #a1a1aa;
    }

    .switch-chip {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.09);
      color: #f4f4f5;
      cursor: pointer;
      flex-shrink: 0;
    }

    .switch-chip:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Countdown bar */
    .countdown-track {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      margin-top: 4px;
    }

    .countdown-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transition: width 250ms linear;
    }

    /* Overview rows */
    .ov-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ov-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.055);
      font-size: 11.5px;
    }

    .ov-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ov-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 9px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 11.5px;
    }

    .ov-item-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .ov-item-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e4e4e7;
    }

    .int-chips {
      display: inline-flex;
      gap: 3px;
    }

    .int-chip {
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #a1a1aa;
      cursor: pointer;
    }

    .int-chip.active {
      border-color: rgba(34, 197, 94, 0.65);
      background: rgba(34, 197, 94, 0.18);
      color: #4ade80;
      font-weight: 700;
    }

    /* Inline Right-Click Context Menu */
    .ctx-menu {
      margin-top: 8px;
      width: 248px;
      border-radius: 14px;
      background: rgba(16, 18, 24, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.42);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 3px;
      animation: fadeSoft 130ms ease-out;
    }

    .ctx-menu.open {
      display: flex;
    }

    .ctx-btn {
      width: 100%;
      border: none;
      background: transparent;
      color: #e4e4e7;
      font-size: 12px;
      font-family: inherit;
      padding: 6px 9px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ctx-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .ctx-row {
      padding: 5px 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: #a1a1aa;
    }

    .ctx-sep {
      height: 1px;
      background: rgba(255, 255, 255, 0.09);
      margin: 2px 4px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div id="dock" class="dock">
      <div id="main-island" class="island compact-hover"></div>
      <div id="health-orb" class="health-orb" title="点击打开护腰行动卡 · 右键快捷菜单"></div>
    </div>
    <div id="ctx-menu" class="ctx-menu"></div>
  </div>

  <script>
    let ACTIONS = [
      { title: "原地深蹲 15 个", title_en: "15 Bodyweight Squats", seconds: 45, tip: "膝盖对准脚尖、臀部往后坐，唤醒久坐睡死的臀肌", tip_en: "Track knees over toes, sit hips back, and wake up sleepy glutes." },
      { title: "麦肯基俯卧轻撑", title_en: "McKenzie Press-Up", seconds: 30, tip: "手肘撑稳微微抬头，骨盆贴地放松，给腰椎反向减压", tip_en: "Prop on elbows, keep hips relaxed on the floor, decompress lower back." },
      { title: "站起来接水 + 远眺", title_en: "Refill Water + 20ft Gaze", seconds: 120, tip: "离开椅子走两步，顺便让睫状肌松一口气", tip_en: "Walk away from your desk and relax eye focus on a distant point." },
      { title: "靠墙静蹲", title_en: "Wall Sit Hold", seconds: 45, tip: "后背贴实墙面、小腿垂直地面，稳住核心不塌腰", tip_en: "Press your back flat against the wall, shins vertical, brace your core." },
      { title: "站立扩胸 + 绕肩", title_en: "Standing Chest Opener", seconds: 60, tip: "双手背后相扣轻轻拉开胸腔，对抗低头圆肩", tip_en: "Clasp hands behind your back and roll shoulders open against hunching." },
      { title: "踮脚提踵 25 次", title_en: "25 Standing Calf Raises", seconds: 40, tip: "站直慢起慢落，促进下肢血液回流", tip_en: "Rise slowly onto your toes and lower smoothly to boost leg circulation." }
    ];

    const state = {
      nowMs: Date.now(),
      language: "auto", // auto | zh | en
      resolvedLang: (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en",
      health: {
        seatedSeconds: 0,
        intervalMinutes: 50,
        todayCount: 0,
        alertActive: false,
        actionIndex: 0,
        snoozed: false,
        paused: false,
        pauseRemainMinutes: 0,
        isLateNight: false
      },
      alerts: [],
      working: [],
      history: [],
      muted: false,
      view: "compact", // compact | agy | health | overview
      pinned: false,
      manualHealthOpen: false,
      ctxOpen: false,
      activeAlertId: "",
      tickerIdx: 0,
      countdown: {
        active: false,
        paused: false,
        total: 0,
        remain: 0
      },
      copyTip: "",
      toastText: ""
    };

    const dock = document.getElementById("dock");
    const mainIsland = document.getElementById("main-island");
    const healthOrb = document.getElementById("health-orb");
    const ctxMenu = document.getElementById("ctx-menu");

    let lastRenderKey = "";
    let lastViewMode = "";
    let hoverOpenTimer = null;
    let hoverCloseTimer = null;
    let autoCollapseTimer = null;
    let autoCollapseMs = 0;
    let toastTimer = null;
    let countdownInterval = null;
    let hitRectTimer = null;
    let pointerInsideDock = false;

    function postHost(msg) {
      try {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(msg);
        }
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getSourceLabel(source) {
      if (!source || source === "antigravity") return "AGY";
      if (source === "ClaudeCode") return "Claude";
      if (source === "Codex") return "Codex";
      return source;
    }

    function getBrandGlyph(source, colorOverride) {
      const s = (source || "antigravity").toLowerCase();
      if (s === "claudecode" || s === "claude") {
        // Claude starburst glyph (warm terracotta #d97757)
        const c = colorOverride || "#e07a5f";
        return `<svg viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.65" stroke-linecap="round">
          <line x1="8" y1="1.8" x2="8" y2="14.2"/><line x1="1.8" y1="8" x2="14.2" y2="8"/>
          <line x1="3.6" y1="3.6" x2="12.4" y2="12.4"/><line x1="12.4" y1="3.6" x2="3.6" y2="12.4"/>
        </svg>`;
      }
      if (s === "codex" || s === "openai") {
        // OpenAI / Codex geometric hex-knot glyph
        const c = colorOverride || "#e4e4e7";
        return `<svg viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.35" stroke-linejoin="round">
          <polygon points="8,1.8 13.4,4.9 13.4,11.1 8,14.2 2.6,11.1 2.6,4.9"/>
          <circle cx="8" cy="8" r="2.1"/>
        </svg>`;
      }
      if (s === "antigravity" || s === "agy") {
        // Antigravity levitating chevron-orbit glyph
        const c = colorOverride || "#60a5fa";
        return `<svg viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12.2 L8 2.6 L13 12.2"/>
          <path d="M5.1 9.6 Q8 7.5 10.9 9.6"/>
        </svg>`;
      }
      // Universal CLI terminal prompt glyph >_
      const c = colorOverride || "#34d399";
      return `<svg viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3,4.5 7,8 3,11.5"/><line x1="8.5" y1="11.5" x2="13" y2="11.5"/>
      </svg>`;
    }

    function isEn() {
      return state.resolvedLang === "en";
    }

    function applyLocalLanguage(pref, hostResolved) {
      const p = (pref || "auto").toLowerCase();
      state.language = (p === "zh" || p === "en") ? p : "auto";
      if (state.language === "zh" || state.language === "en") {
        state.resolvedLang = state.language;
      } else if (hostResolved === "zh" || hostResolved === "en") {
        state.resolvedLang = hostResolved;
      } else {
        state.resolvedLang = (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
      }
      document.documentElement.lang = isEn() ? "en" : "zh-CN";
    }

    try {
      const savedLang = localStorage.getItem("agentisland_lang");
      if (savedLang === "auto" || savedLang === "zh" || savedLang === "en") {
        applyLocalLanguage(savedLang, "");
      }
    } catch (e) {}

    function getCompactKindTag(kind) {
      if (isEn()) {
        if (kind === "error") return "Err";
        if (kind === "needs_approval") return "Perm";
        if (kind === "needs_decision") return "Ask";
        return "";
      }
      if (kind === "error") return "报错";
      if (kind === "needs_approval") return "审批";
      if (kind === "needs_decision") return "拍板";
      return "";
    }

    function localizeAlertBadge(item, st) {
      const standardZh = { "报错卡住": true, "待批准命令": true, "待批准权限": true, "等你拍板": true, "等你介入": true, "等你回复": true, "触顶暂停": true };
      if (!item.title || standardZh[item.title]) return st.label;
      return item.title;
    }

    function localizeSummary(text) {
      const s = String(text || "");
      if (!isEn()) return s;
      return s
        .replace(/^待你回复：/, "Question: ")
        .replace(/^请求批准\s+/, "Approve ")
        .replace(/^越沙盒命令：/, "Command: ")
        .replace(/^本轮回复已完成，等你下一步指示$/, "Reply ready — waiting for your next instruction")
        .replace(/^Claude Code 本轮回复已完成$/, "Claude Code finished this turn")
        .replace(/^Codex 本轮任务已完成，等你下一步指示$/, "Codex finished this turn");
    }

    function getSessionLabel(item) {
      if (!item) return "Agent";
      return item.sessionName || item.project || getSourceLabel(item.source);
    }

    function getSubMeta(item) {
      if (!item) return "";
      const primary = getSessionLabel(item);
      const src = item.source || "antigravity";
      if (src !== "antigravity") {
        const srcLabel = getSourceLabel(src);
        return primary.toLowerCase() === srcLabel.toLowerCase() ? "" : ` · ${srcLabel}`;
      }
      if (item.project && item.project !== primary && item.project !== "Antigravity") {
        return ` · ${item.project}`;
      }
      return "";
    }

    function getAlertLevel(item) {
      if (!item) return 0;
      if (typeof item.level === "number" && item.level >= 0) return item.level;
      if (item.kind === "needs_approval") return 3;
      if (item.kind === "needs_decision" || item.kind === "error") return 2;
      if (item.kind === "needs_reply") return 1;
      return 0;
    }

    function isStrongKind(kind) {
      return kind === "error" || kind === "needs_approval" || kind === "needs_decision";
    }

    function formatWait(ts) {
      if (!ts) return isEn() ? "Just now" : "刚刚";
      const sec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      if (sec < 45) return isEn() ? "Just now" : "刚刚";
      const m = Math.floor(sec / 60);
      if (m < 60) return isEn() ? `${m}m ago` : `已等 ${m}m`;
      return isEn() ? `${Math.floor(m / 60)}h${m % 60}m` : `已等 ${Math.floor(m / 60)}h${m % 60}m`;
    }

    function getAlertStyle(kind) {
      if (kind === "error") {
        return { color: "#ef4444", textColor: "#ffffff", glow: "glow-red", label: isEn() ? "Error" : "报错卡住" };
      }
      if (kind === "needs_approval") {
        return { color: "#f97316", textColor: "#09090b", glow: "glow-amber", label: isEn() ? "Approval" : "待批准命令" };
      }
      if (kind === "needs_decision") {
        return { color: "#f59e0b", textColor: "#09090b", glow: "glow-amber", label: isEn() ? "Decision" : "等你拍板" };
      }
      return { color: "#3b82f6", textColor: "#ffffff", glow: "glow-blue", label: isEn() ? "Reply" : "等你回复" };
    }

    function getActiveAlert() {
      if (state.alerts.length === 0) {
        state.activeAlertId = "";
        return { item: null, idx: 0 };
      }
      let idx = state.alerts.findIndex(a => a.id === state.activeAlertId);
      if (idx < 0) {
        idx = 0;
        state.activeAlertId = state.alerts[0].id;
      }
      return { item: state.alerts[idx], idx };
    }

    function computeMainSize(view) {
      if (view === "agy") return { w: 438, h: state.toastText ? 148 : 132, r: 22 };
      if (view === "health") return { w: 438, h: 158, r: 22 };
      if (view === "overview") return { w: 438, h: 188, r: 22 };
      if (state.alerts.length > 0) return { w: 196, h: 36, r: 18 };
      if (state.working.length > 0) return { w: 168, h: 36, r: 18 };
      return { w: 112, h: 36, r: 18 };
    }

    function reportHitRectsNow() {
      const rects = [];
      const addRect = (el, pad) => {
        if (!el) return null;
        const r = el.getBoundingClientRect();
        if (r.width > 4 && r.height > 4) {
          const box = {
            x: Math.round(r.left - pad),
            y: Math.round(r.top - pad),
            w: Math.round(r.width + pad * 2),
            h: Math.round(r.height + pad * 2)
          };
          rects.push(box);
          return box;
        }
        return null;
      };
      const mainBox = addRect(mainIsland, 1);
      if (state.view === "compact" && !healthOrb.classList.contains("hidden-orb")) {
        addRect(healthOrb, 1);
      }
      if (state.ctxOpen) {
        const ctxBox = addRect(ctxMenu, 2);
        // Bridge the 8px vertical gap between pill/card and open context menu so moving downward never flickers
        if (mainBox && ctxBox && ctxBox.y > mainBox.y + mainBox.h) {
          rects.push({
            x: Math.min(mainBox.x, ctxBox.x),
            y: mainBox.y + mainBox.h - 1,
            w: Math.max(mainBox.x + mainBox.w, ctxBox.x + ctxBox.w) - Math.min(mainBox.x, ctxBox.x),
            h: ctxBox.y - (mainBox.y + mainBox.h) + 2
          });
        }
      }
      postHost({
        type: "hit_rects",
        dpr: window.devicePixelRatio || 1,
        rects: rects
      });
    }

    function scheduleHitRectSync() {
      requestAnimationFrame(() => reportHitRectsNow());
      if (hitRectTimer) clearTimeout(hitRectTimer);
      hitRectTimer = setTimeout(reportHitRectsNow, 370);
    }

    function clearAutoCollapseTimer() {
      if (autoCollapseTimer) {
        clearTimeout(autoCollapseTimer);
        autoCollapseTimer = null;
      }
      autoCollapseMs = 0;
    }

    function armAutoCollapse(delayMs) {
      clearAutoCollapseTimer();
      if (!delayMs || delayMs <= 0) return;
      autoCollapseMs = delayMs;
      autoCollapseTimer = setTimeout(() => {
        autoCollapseTimer = null;
        autoCollapseMs = 0;
        if (state.view === "compact") return;
        if (pointerInsideDock || state.ctxOpen || state.countdown.active || state.countdown.paused) {
          // Reschedule gently while pointer is still hovering or workout is active
          if (!state.countdown.active && !state.countdown.paused) armAutoCollapse(delayMs);
          return;
        }
        state.manualHealthOpen = false;
        state.pinned = false;
        state.view = "compact";
        render(true);
      }, delayMs);
    }

    function showToast(text) {
      state.toastText = text || "";
      if (toastTimer) clearTimeout(toastTimer);
      render(true);
      if (state.toastText) {
        toastTimer = setTimeout(() => {
          toastTimer = null;
          state.toastText = "";
          render(true);
        }, 2600);
      }
    }

    // ==================== Countdown (True Pause / Resume) ====================

    function resetCountdown() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      state.countdown.active = false;
      state.countdown.paused = false;
      state.countdown.total = 0;
      state.countdown.remain = 0;
    }

    function pauseCountdown() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      state.countdown.active = false;
      state.countdown.paused = state.countdown.remain > 0;
      render(true);
    }

    function startOrResumeCountdown(seconds) {
      if (state.countdown.active) {
        pauseCountdown();
        return;
      }
      if (!state.countdown.paused || state.countdown.remain <= 0) {
        state.countdown.total = seconds;
        state.countdown.remain = seconds;
      }
      state.countdown.active = true;
      state.countdown.paused = false;
      state.pinned = true;
      state.manualHealthOpen = true;
      clearAutoCollapseTimer();
      render(true);

      countdownInterval = setInterval(() => {
        state.countdown.remain--;
        if (state.countdown.remain <= 0) {
          resetCountdown();
          postHost({ type: "play_done_chime" });
          state.manualHealthOpen = false;
          state.health.alertActive = false;
          state.health.seatedSeconds = 0;
          state.health.snoozed = false;
          state.health.todayCount = (state.health.todayCount || 0) + 1;
          postHost({ type: "health_done" });
          const top = state.alerts[0];
          const topLvl = getAlertLevel(top);
          if (top && topLvl >= 2) {
            state.view = "agy";
            state.activeAlertId = top.id;
            state.pinned = false;
            armAutoCollapse(topLvl >= 3 ? 30000 : 8000);
          } else {
            state.view = "compact";
            state.pinned = false;
            clearAutoCollapseTimer();
          }
          render(true);
        } else {
          updateCountdownDom();
        }
      }, 1000);
    }

    function updateCountdownDom() {
      const btn = document.getElementById("btn-countdown");
      const fill = document.getElementById("countdown-fill");
      if (!btn || !fill) return;
      if (state.countdown.active) {
        const pct = Math.max(0, Math.min(100, Math.round(((state.countdown.total - state.countdown.remain) / state.countdown.total) * 100)));
        btn.textContent = isEn()
          ? `${state.countdown.remain}s left (Pause)`
          : `跟练中 ${state.countdown.remain}s（点暂停）`;
        fill.style.width = pct + "%";
      }
    }

    // ==================== Render Helpers ====================

    function renderHealthOrb() {
      const showOrb = (state.view === "compact");
      dock.classList.toggle("merged", !showOrb);
      healthOrb.classList.toggle("hidden-orb", !showOrb);

      const mins = Math.floor(state.health.seatedSeconds / 60);
      const interval = state.health.intervalMinutes || 50;
      const pct = Math.min(1, state.health.seatedSeconds / (interval * 60));
      const r = 13.5;
      const circ = 2 * Math.PI * r;
      const dashOffset = (circ * (1 - pct)).toFixed(2);

      let strokeColor = "#22c55e";
      let label = String(mins);
      if (state.health.paused) {
        strokeColor = "#71717a";
        label = isEn() ? "||" : "停";
      } else if (state.health.snoozed) {
        strokeColor = "#f59e0b";
        label = "+5";
      } else if (state.health.alertActive || pct >= 1) {
        strokeColor = "#4ade80";
        label = isEn() ? "Go" : "起";
      } else if (pct >= 0.8) {
        strokeColor = "#f59e0b";
      }

      healthOrb.title = isEn()
        ? "Click for Posture Break · Right-click for Quick Menu"
        : "点击打开护腰行动卡 · 右键快捷菜单";
      healthOrb.classList.toggle("orb-alert", !!state.health.alertActive);
      healthOrb.innerHTML = `
        <svg class="orb-svg" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="${r}" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2.6"></circle>
          <circle cx="18" cy="18" r="${r}" fill="none" stroke="${strokeColor}" stroke-width="2.6" stroke-linecap="round"
            stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${dashOffset}" style="transition:stroke-dashoffset 350ms ease,stroke 250ms ease;"></circle>
        </svg>
        <span class="orb-label" style="color:${state.health.alertActive ? '#4ade80' : '#f4f4f5'}">${label}</span>`;
    }

    function renderContextMenu() {
      ctxMenu.classList.toggle("open", state.ctxOpen);
      if (!state.ctxOpen) {
        ctxMenu.innerHTML = "";
        return;
      }
      const curInt = state.health.intervalMinutes || 50;
      const intervals = [30, 45, 50, 60].map(m =>
        `<button class="int-chip ${curInt === m ? 'active' : ''}" data-action="set-interval" data-val="${m}">${m}m</button>`
      ).join("");
      const langChips = [
        { k: "auto", t: isEn() ? "Auto" : "自动" },
        { k: "zh", t: "中" },
        { k: "en", t: "EN" }
      ].map(x => `<button class="int-chip ${state.language === x.k ? 'active' : ''}" data-action="set-language" data-val="${x.k}">${x.t}</button>`).join("");

      const pauseLabel = state.health.paused
        ? (isEn() ? `▶ Resume Breaks (${state.health.pauseRemainMinutes || 1}m left)` : `▶ 恢复护腰提醒（剩 ${state.health.pauseRemainMinutes || 1}m）`)
        : (isEn() ? "⏸ Pause Breaks 1h" : "⏸ 暂停护腰 1 小时");
      const muteLabel = state.muted
        ? (isEn() ? "🔊 Unmute Sounds" : "🔊 开启提示音")
        : (isEn() ? "🔕 Mute Sounds" : "🔕 静音提示音");
      const doneLabel = isEn() ? "✓ Stood Up (Reset +1)" : "✓ 刚站过（清零 + 今日打卡）";
      const doneCount = isEn() ? `${state.health.todayCount}x` : `${state.health.todayCount}次`;

      ctxMenu.innerHTML = `
        <button class="ctx-btn" data-action="health-done"><span>${doneLabel}</span><span class="meta-text">${doneCount}</span></button>
        <div class="ctx-row"><span>⏱ ${isEn() ? "Interval" : "久坐间隔"}</span><div class="int-chips">${intervals}</div></div>
        <div class="ctx-row"><span>🌐 ${isEn() ? "Language" : "语言"}</span><div class="int-chips">${langChips}</div></div>
        <div class="ctx-sep"></div>
        <button class="ctx-btn" data-action="toggle-pause"><span>${pauseLabel}</span></button>
        <button class="ctx-btn" data-action="toggle-mute"><span>${muteLabel}</span></button>
        <button class="ctx-btn" data-action="open-health-pin"><span>🏋 ${isEn() ? "Start Posture Break" : "立即做一组护腰动作"}</span></button>
        <div class="ctx-sep"></div>
        <button class="ctx-btn" data-action="close-ctx"><span style="color:#a1a1aa">${isEn() ? "Close Menu" : "关闭菜单"}</span><span class="meta-text">Alt+\\</span></button>`;
    }

    // ==================== Priority & Attention Tiering Arbiter ====================

    function resolveAutoView(triggerExpand, focusKind) {
      const countdownProtected = (state.view === "health" && (state.countdown.active || state.countdown.paused));

      if (triggerExpand) {
        state.ctxOpen = false;

        if (focusKind === "agy" && state.alerts.length > 0) {
          // Never interrupt an active or paused health workout countdown!
          if (countdownProtected) return;

          const top = state.alerts[0];
          const lvl = getAlertLevel(top);

          // L1 (needs_reply / info): NEVER force-expand a big card; stay inside the rotating capsule ticker!
          if (lvl <= 1) {
            return;
          }

          // If user is already inspecting a pinned alert card, don't yank their cursor unless an L3 blocking alert arrived
          if (state.view === "agy" && state.pinned && state.activeAlertId && lvl < 3) {
            if (state.alerts.some(a => a.id === state.activeAlertId)) {
              return;
            }
          }

          state.view = "agy";
          state.activeAlertId = top.id;
          state.manualHealthOpen = false;
          state.pinned = false;
          // L2 (decision/error) -> 8s glance toast; L3 (blocking approval) -> 30s before graceful collapse to pulse capsule
          armAutoCollapse(lvl >= 3 ? 30000 : 8000);
          return;
        }

        if (focusKind === "health" && state.health.alertActive) {
          state.view = "health";
          state.pinned = false;
          state.manualHealthOpen = false;
          // If user is away/busy for 45s without starting workout, collapse gracefully to pulsing green orb
          armAutoCollapse(45000);
          return;
        }
      }

      // Guard: if viewing agy and queue became empty, step down cleanly
      if (state.view === "agy" && state.alerts.length === 0) {
        clearAutoCollapseTimer();
        state.activeAlertId = "";
        state.view = state.health.alertActive ? "health" : "compact";
        state.pinned = false;
        if (state.view === "health") armAutoCollapse(45000);
      }

      // Guard: ONLY auto-close health if it was auto-opened (never yank a manually opened health card!)
      if (state.view === "health" && !state.manualHealthOpen && !state.health.alertActive && !state.countdown.active && !state.countdown.paused) {
        const top = state.alerts[0];
        const topLvl = getAlertLevel(top);
        if (top && topLvl >= 2) {
          state.view = "agy";
          state.activeAlertId = top.id;
          state.pinned = false;
          armAutoCollapse(topLvl >= 3 ? 30000 : 8000);
        } else {
          state.view = "compact";
          state.pinned = false;
          clearAutoCollapseTimer();
        }
      }
    }

    function render(forceHtml) {
      const target = computeMainSize(state.view);
      mainIsland.style.width = target.w + "px";
      mainIsland.style.height = target.h + "px";
      mainIsland.style.borderRadius = target.r + "px";

      const viewChanged = (state.view !== lastViewMode);
      if (viewChanged && lastViewMode === "health") {
        resetCountdown();
        state.manualHealthOpen = false;
      }
      if (viewChanged && lastViewMode === "agy") {
        state.toastText = "";
      }
      if (viewChanged && state.view === "compact") {
        clearAutoCollapseTimer();
      }
      lastViewMode = state.view;
      const enterCls = viewChanged ? " content-enter" : "";

      mainIsland.className = "island" + (state.view === "compact" ? " compact-hover" : "");

      const mins = Math.floor(state.health.seatedSeconds / 60);
      const interval = state.health.intervalMinutes || 50;

      let html = "";
      let renderKey = "";

      if (state.view === "compact") {
        if (state.alerts.length > 0) {
          const tIdx = state.tickerIdx % state.alerts.length;
          const cur = state.alerts[tIdx];
          const st = getAlertStyle(cur.kind);
          const sessionTitle = getSessionLabel(cur);
          const kindTag = getCompactKindTag(cur.kind);
          const rightBadge = state.alerts.length > 1
            ? `${tIdx + 1}/${state.alerts.length}`
            : (kindTag || "1");
          mainIsland.classList.add(st.glow);
          renderKey = `compact-alert-${cur.id}-${cur.source}-${cur.kind}-${sessionTitle}-${tIdx}-${state.alerts.length}`;
          html = `
            <div class="pill-bar${enterCls}" data-action="open-agy-pin" data-id="${escapeHtml(cur.id)}">
              <div class="pill-left">
                <span class="brand-icon brand-pulse">${getBrandGlyph(cur.source, st.color)}</span>
                <span class="pill-text ticker-text">${escapeHtml(sessionTitle)}</span>
              </div>
              <div class="pill-right">
                <span class="mini-badge" style="background:${st.color}26;color:${st.color}">${escapeHtml(rightBadge)}</span>
              </div>
            </div>`;
        } else if (state.working.length > 0) {
          mainIsland.classList.add("glow-blue");
          const wCount = state.working.length;
          const wIdx = state.tickerIdx % wCount;
          const curW = state.working[wIdx];
          const sessionTitle = getSessionLabel(curW);
          const rightEl = wCount > 1
            ? `<span class="muted-tag">${wIdx + 1}/${wCount}</span>`
            : `<span class="wave-bars" aria-hidden="true"><span></span><span></span><span></span></span>`;
          renderKey = `compact-work-${wIdx}-${wCount}-${curW.source}-${sessionTitle}`;
          html = `
            <div class="pill-bar${enterCls}" data-action="open-overview-pin">
              <div class="pill-left">
                <span class="brand-icon brand-pulse">${getBrandGlyph(curW.source)}</span>
                <span class="pill-text ticker-text">${escapeHtml(sessionTitle)}</span>
              </div>
              <div class="pill-right">${rightEl}</div>
            </div>`;
        } else {
          const muteSvg = state.muted
            ? `<svg viewBox="0 0 14 14" width="11" height="11" fill="none" stroke="#71717a" stroke-width="1.4" stroke-linecap="round" style="vertical-align:-1px;margin-right:3px;"><path d="M2 5.2h2.2L7 2.8v8.4L4.2 8.8H2z"/><line x1="9.6" y1="5" x2="12.6" y2="9"/><line x1="12.6" y1="5" x2="9.6" y2="9"/></svg>`
            : "";
          renderKey = `compact-idle-${state.health.todayCount}-${state.muted}`;
          html = `
            <div class="pill-bar${enterCls}" data-action="open-overview-pin">
              <div class="pill-left">
                <span class="dot" style="background:#22c55e"></span>
                <span class="brand-icon">${getBrandGlyph("antigravity", "#a1a1aa")}</span>
              </div>
              <div class="pill-right">
                <span class="muted-tag">${muteSvg}✓ ${state.health.todayCount}</span>
              </div>
            </div>`;
        }
      } else if (state.view === "agy") {
        const active = getActiveAlert();
        if (!active.item) {
          state.view = "compact";
          return render(true);
        }
        const item = active.item;
        const idx = active.idx;
        const st = getAlertStyle(item.kind);
        mainIsland.classList.add(st.glow);
        const waitText = formatWait(item.timestamp);
        const sessionTitle = getSessionLabel(item);
        const subMeta = (item.project && item.project !== sessionTitle && item.project !== "Antigravity")
          ? ` · ${item.project}`
          : "";
        const badgeLabel = localizeAlertBadge(item, st);
        const displaySummary = localizeSummary(item.summary);
        const healthChip = state.health.alertActive
          ? `<button class="switch-chip" data-action="open-health-pin">${isEn() ? "🟢 Break" : "🟢 护腰"}</button>`
          : "";
        const nextBtn = state.alerts.length > 1
          ? `<button class="btn btn-secondary" data-action="agy-next">${isEn() ? "Next" : "下一条"} (${idx + 1}/${state.alerts.length})</button>`
          : "";
        const focusLabel = (!item.source || item.source === "antigravity")
          ? (isEn() ? "Open Session ↗" : "直达该会话 ↗")
          : ((item.source === "ClaudeCode" || item.source === "Codex")
              ? (isEn() ? "Focus Terminal ↗" : "切到终端 ↗")
              : (isEn() ? "Mark Read ✓" : "标记已读 ✓"));
        const toastHtml = state.toastText
          ? `<div class="toast-line">⚠ ${escapeHtml(state.toastText)}</div>`
          : "";

        renderKey = `agy-${state.resolvedLang}-${item.id}-${item.source}-${item.kind}-${sessionTitle}-${subMeta}-${displaySummary}-${idx}-${state.alerts.length}-${waitText}-${state.health.alertActive}-${state.copyTip}-${state.toastText}`;
        html = `
          <div class="card${enterCls}">
            <div class="card-top">
              <div class="card-top-left">
                <span class="brand-icon">${getBrandGlyph(item.source)}</span>
                <span class="badge" style="background:${st.color}24;color:${st.color};border-color:${st.color}55">${escapeHtml(badgeLabel)}</span>
                <span class="project-name">${escapeHtml(sessionTitle)}</span>
                ${subMeta ? `<span class="source-sub">${escapeHtml(subMeta)}</span>` : ""}
              </div>
              <div class="card-top-right">
                ${healthChip}
                <span class="meta-text">${escapeHtml(waitText)}</span>
                <button class="icon-btn" data-action="copy-alert" data-text="${escapeHtml(sessionTitle + ' | ' + displaySummary)}" title="${isEn() ? 'Copy' : '复制摘要'}">${state.copyTip ? '✓' : '⧉'}</button>
                <button class="icon-btn" data-action="collapse" title="${isEn() ? 'Collapse' : '收起'}">−</button>
              </div>
            </div>
            <div>
              <div class="summary">${escapeHtml(displaySummary)}</div>
              ${toastHtml}
            </div>
            <div class="actions">
              <button class="btn" style="background:${st.color};color:${st.textColor}" data-action="agy-focus" data-id="${escapeHtml(item.id)}">
                ${focusLabel}
              </button>
              <div class="btn-group">
                ${nextBtn}
                <button class="btn btn-ghost" data-action="agy-dismiss" data-id="${escapeHtml(item.id)}">${isEn() ? "Dismiss" : "知道了"}</button>
              </div>
            </div>
          </div>`;
      } else if (state.view === "health") {
        mainIsland.classList.add("glow-green");
        const act = ACTIONS[state.health.actionIndex % ACTIONS.length];
        const actTitle = (isEn() && act.title_en) ? act.title_en : act.title;
        const actTip = (isEn() && act.tip_en) ? act.tip_en : act.tip;
        const agyChip = state.alerts.length > 0
          ? `<button class="switch-chip" data-action="open-agy-pin">${isEn() ? "⚡ Alerts" : "⚡ 待介入"} (${state.alerts.length})</button>`
          : "";
        const isDue = !!state.health.alertActive;
        const badgeText = isEn()
          ? (isDue ? `${interval}m Break Due` : "Quick Break")
          : (isDue ? `坐满 ${interval}m · 救腰` : "主动加练 · 救腰");
        const metaText = isEn()
          ? (state.health.isLateNight
              ? `Late Night · Break #${state.health.todayCount + 1}`
              : `Seated ${isDue ? Math.max(mins, interval) : mins}m · ${state.health.todayCount} today`)
          : (state.health.isLateNight
              ? `已过凌晨 · 今日第 ${state.health.todayCount + 1} 次`
              : (isDue
                  ? `已连坐 ${Math.max(mins, interval)}m · 今日 ${state.health.todayCount} 次`
                  : `当前已坐 ${mins}m · 今日 ${state.health.todayCount} 次`));

        const cdPct = (state.countdown.active || state.countdown.paused) && state.countdown.total > 0
          ? Math.round(((state.countdown.total - state.countdown.remain) / state.countdown.total) * 100)
          : 0;
        let cdLabel = isEn() ? `Start ${act.seconds}s ▶` : `开始跟练 ${act.seconds}s ▶`;
        if (state.countdown.active) {
          cdLabel = isEn() ? `${state.countdown.remain}s left (Pause)` : `跟练中 ${state.countdown.remain}s（点暂停）`;
        } else if (state.countdown.paused) {
          cdLabel = isEn() ? `Paused ${state.countdown.remain}s (Resume ▶)` : `已暂停 ${state.countdown.remain}s（继续 ▶）`;
        }

        renderKey = `health-${state.resolvedLang}-${state.health.actionIndex}-${state.alerts.length}-${mins}-${isDue}-${state.health.todayCount}-${state.countdown.active}-${state.countdown.paused}-${state.countdown.remain}`;
        html = `
          <div class="card${enterCls}">
            <div class="card-top">
              <div class="card-top-left">
                <span class="badge" style="background:rgba(34,197,94,0.2);color:#4ade80;border-color:rgba(34,197,94,0.45)">${escapeHtml(badgeText)}</span>
              </div>
              <div class="card-top-right">
                ${agyChip}
                <span class="meta-text">${escapeHtml(metaText)}</span>
                <button class="icon-btn" data-action="collapse" title="${isEn() ? 'Collapse' : '收起'}">−</button>
              </div>
            </div>
            <div>
              <div class="main-title">${escapeHtml(actTitle)}${isEn() ? ` (${act.seconds}s)` : `（${act.seconds} 秒）`}</div>
              <div class="sub-tip">${escapeHtml(actTip)}</div>
              <div class="countdown-track"><div id="countdown-fill" class="countdown-fill" style="width:${cdPct}%"></div></div>
            </div>
            <div class="actions">
              <button id="btn-countdown" class="btn" style="background:#22c55e;color:#052e16" data-action="health-countdown" data-sec="${act.seconds}">
                ${cdLabel}
              </button>
              <div class="btn-group">
                <button class="btn btn-secondary" data-action="health-done">${isEn() ? "Done ✓" : "已动 ✓"}</button>
                <button class="btn btn-secondary" data-action="health-shuffle">${isEn() ? "Next" : "换"}</button>
                <button class="btn btn-ghost" data-action="health-snooze">+5m</button>
              </div>
            </div>
          </div>`;
      } else if (state.view === "overview") {
        const curInt = state.health.intervalMinutes || 50;
        const intervals = [30, 45, 50, 60].map(m =>
          `<button class="int-chip ${curInt === m ? 'active' : ''}" data-action="set-interval" data-val="${m}">${m}m</button>`
        ).join("");

        let listHtml = "";
        if (state.alerts.length > 0) {
          listHtml += state.alerts.slice(0, 2).map(a => {
            const st = getAlertStyle(a.kind);
            const sName = getSessionLabel(a);
            const bLabel = localizeAlertBadge(a, st);
            return `<div class="ov-item">
              <div class="ov-item-left"><span class="brand-icon">${getBrandGlyph(a.source, st.color)}</span><span class="ov-item-text"><strong>${escapeHtml(sName)}</strong> · ${escapeHtml(bLabel)} (${formatWait(a.timestamp)})</span></div>
              <button class="switch-chip" data-action="open-agy-pin" data-id="${escapeHtml(a.id)}">${isEn() ? "Open" : "处理"}</button>
            </div>`;
          }).join("");
          if (state.alerts.length > 2) {
            listHtml += `<div class="ov-item">
              <span class="meta-text">${isEn() ? `+${state.alerts.length - 2} more pending` : `还有 ${state.alerts.length - 2} 条待介入通知`}</span>
              <button class="switch-chip" data-action="agy-dismiss-all">${isEn() ? "Clear All" : "全部已读"}</button>
            </div>`;
          }
        } else if (state.working.length > 0) {
          listHtml += state.working.slice(0, 2).map(w =>
            `<div class="ov-item">
              <div class="ov-item-left"><span class="brand-icon brand-pulse">${getBrandGlyph(w.source)}</span><span class="ov-item-text"><strong>${escapeHtml(getSessionLabel(w))}</strong></span></div>
              <span class="wave-bars" aria-hidden="true"><span></span><span></span><span></span></span>
            </div>`
          ).join("");
        }

        if (state.history.length > 0 && state.alerts.length <= 2) {
          const h = state.history[0];
          const hSt = getAlertStyle(h.kind);
          listHtml += `<div class="ov-item">
            <div class="ov-item-left"><span class="dot" style="background:#71717a"></span><span class="ov-item-text" style="color:#a1a1aa">${isEn() ? "Recent · " : "已看 · "}${escapeHtml(getSessionLabel(h))} · ${escapeHtml(localizeAlertBadge(h, hSt))}</span></div>
            <button class="switch-chip" data-action="history-restore" data-id="${escapeHtml(h.id)}">${isEn() ? "Restore" : "恢复"}</button>
          </div>`;
        } else if (!listHtml) {
          listHtml = `<div class="ov-item"><span class="meta-text">${isEn() ? "No pending alerts" : "暂无待处理会话"}</span></div>`;
        }

        const pauseText = state.health.paused
          ? (isEn() ? ` (Paused ${state.health.pauseRemainMinutes || 1}m)` : `（暂停 ${state.health.pauseRemainMinutes || 1}m）`)
          : "";

        renderKey = `ov-${state.resolvedLang}-${mins}-${curInt}-${state.health.todayCount}-${state.alerts.length}-${state.working.length}-${state.history.length}-${state.muted}-${state.health.paused}-${state.health.pauseRemainMinutes}`;
        html = `
          <div class="card${enterCls}">
            <div class="card-top">
              <div class="card-top-left">
                <span class="dot" style="background:#22c55e"></span>
                <span class="project-name">${isEn() ? `Seated ${mins}/${curInt}m${pauseText}` : `坐姿 ${mins}/${curInt}m${pauseText}`}</span>
                <span class="meta-text">${isEn() ? `· ${state.health.todayCount} today` : `· 今日 ${state.health.todayCount} 次`}</span>
              </div>
              <div class="card-top-right">
                ${state.alerts.length > 1 ? `<button class="switch-chip" data-action="agy-dismiss-all">${isEn() ? "Clear All" : "全已读"}</button>` : `<div class="int-chips">${intervals}</div>`}
                <button class="icon-btn" data-action="collapse" title="${isEn() ? 'Collapse' : '收起'}">−</button>
              </div>
            </div>
            <div class="ov-list">${listHtml}</div>
            <div class="actions">
              <button class="btn" style="background:#22c55e;color:#052e16" data-action="open-health-pin">${isEn() ? "Start Break" : "做一组护腰"}</button>
              <div class="btn-group">
                <button class="btn btn-secondary" data-action="health-done">${isEn() ? "Stood Up +1" : "刚站过 +1"}</button>
                <button class="btn btn-ghost" data-action="toggle-pause">${state.health.paused ? (isEn() ? 'Resume' : '恢复') : (isEn() ? 'Pause 1h' : '暂停1h')}</button>
                <button class="btn btn-ghost" data-action="toggle-mute">${state.muted ? (isEn() ? 'Unmute' : '开音') : (isEn() ? 'Mute' : '静音')}</button>
              </div>
            </div>
          </div>`;
      }

      if (forceHtml || renderKey !== lastRenderKey) {
        lastRenderKey = renderKey;
        mainIsland.innerHTML = html;
      }

      renderHealthOrb();
      renderContextMenu();
      scheduleHitRectSync();
    }

    // ==================== Compact Ticker + Hover Preview ====================

    setInterval(() => {
      if (state.view !== "compact" || pointerInsideDock || state.ctxOpen) return;
      if (state.alerts.length > 1) {
        state.tickerIdx = (state.tickerIdx + 1) % state.alerts.length;
        render(false);
      } else if (state.alerts.length === 0 && state.working.length > 1) {
        state.tickerIdx = (state.tickerIdx + 1) % state.working.length;
        render(false);
      }
    }, 3500);

    function clearHoverTimers() {
      if (hoverOpenTimer) { clearTimeout(hoverOpenTimer); hoverOpenTimer = null; }
      if (hoverCloseTimer) { clearTimeout(hoverCloseTimer); hoverCloseTimer = null; }
    }

    dock.addEventListener("mouseenter", () => {
      pointerInsideDock = true;
      if (hoverCloseTimer) { clearTimeout(hoverCloseTimer); hoverCloseTimer = null; }
      // Responsive hover preview across all states (320ms prevents accidental pass-through triggers while staying snappy)
      if (state.view === "compact" && !state.ctxOpen && !hoverOpenTimer) {
        hoverOpenTimer = setTimeout(() => {
          hoverOpenTimer = null;
          if (state.view === "compact" && !state.ctxOpen) {
            state.pinned = false;
            if (state.alerts.length > 0) {
              const cur = state.alerts[state.tickerIdx % state.alerts.length];
              state.view = "agy";
              state.activeAlertId = cur ? cur.id : state.alerts[0].id;
            } else {
              state.view = "overview";
            }
            render(true);
          }
        }, 320);
      }
    });

    dock.addEventListener("mouseleave", () => {
      pointerInsideDock = false;
      if (hoverOpenTimer) { clearTimeout(hoverOpenTimer); hoverOpenTimer = null; }
      if (state.view !== "compact" && !state.pinned && !state.ctxOpen && !state.countdown.active && !state.countdown.paused) {
        hoverCloseTimer = setTimeout(() => {
          hoverCloseTimer = null;
          if (!state.pinned && !state.ctxOpen && !state.countdown.active && !state.countdown.paused && !pointerInsideDock) {
            state.view = "compact";
            render(true);
          }
        }, 380);
      }
    });

    // Right-click on pill or orb opens inline context menu
    dock.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      clearHoverTimers();
      state.ctxOpen = !state.ctxOpen;
      render(false);
    });

    // Clicking health orb directly opens health break card (manual, 60s idle fallback unless workout starts)
    healthOrb.addEventListener("click", () => {
      clearHoverTimers();
      state.ctxOpen = false;
      state.manualHealthOpen = true;
      state.view = "health";
      state.pinned = true;
      armAutoCollapse(60000);
      render(true);
    });

    // Smooth native horizontal drag
    let downX = 0;
    let pressing = false;
    let moved = false;

    mainIsland.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      if (e.target.closest("button")) return;
      pressing = true;
      moved = false;
      downX = e.clientX;
    });

    window.addEventListener("mousemove", (e) => {
      if (!pressing) return;
      if (Math.abs(e.clientX - downX) >= 5) {
        pressing = false;
        moved = true;
        clearHoverTimers();
        postHost({ type: "begin_drag" });
      }
    });

    window.addEventListener("mouseup", () => {
      pressing = false;
      if (moved) setTimeout(() => { moved = false; }, 80);
    });

    // Unified click delegation (island + context menu)
    document.addEventListener("click", (e) => {
      if (moved) return;
      const target = e.target.closest("[data-action]");
      if (!target) {
        if (state.ctxOpen && !e.target.closest("#ctx-menu")) {
          state.ctxOpen = false;
          render(false);
        }
        return;
      }

      clearHoverTimers();
      const action = target.getAttribute("data-action");
      const id = target.getAttribute("data-id") || "";

      switch (action) {
        case "open-agy-pin":
          state.ctxOpen = false;
          state.manualHealthOpen = false;
          state.view = "agy";
          state.pinned = true;
          if (id) {
            state.activeAlertId = id;
          } else if (state.alerts.length > 0) {
            state.activeAlertId = state.alerts[0].id;
          }
          armAutoCollapse(60000);
          render(true);
          break;
        case "open-health-pin":
          state.ctxOpen = false;
          state.manualHealthOpen = true;
          state.view = "health";
          state.pinned = true;
          armAutoCollapse(60000);
          render(true);
          break;
        case "open-overview-pin":
          state.ctxOpen = false;
          state.manualHealthOpen = false;
          state.view = "overview";
          state.pinned = true;
          armAutoCollapse(60000);
          render(true);
          break;
        case "collapse":
          resetCountdown();
          clearAutoCollapseTimer();
          state.ctxOpen = false;
          state.manualHealthOpen = false;
          state.pinned = false;
          state.view = "compact";
          render(true);
          break;
        case "close-ctx":
          state.ctxOpen = false;
          render(false);
          break;
        case "agy-next":
          state.pinned = true;
          if (state.alerts.length > 1) {
            const cur = getActiveAlert().idx;
            state.activeAlertId = state.alerts[(cur + 1) % state.alerts.length].id;
          }
          armAutoCollapse(60000);
          render(true);
          break;
        case "agy-focus":
          // Let host confirm window focus before archiving; if window not found, host keeps card & sends toast
          state.pinned = true;
          armAutoCollapse(60000);
          postHost({ type: "agy_focus", id });
          break;
        case "agy-dismiss":
          state.alerts = state.alerts.filter(a => a.id !== id);
          if (state.activeAlertId === id) state.activeAlertId = "";
          postHost({ type: "agy_dismiss", id });
          resolveAutoView(false, "");
          render(true);
          break;
        case "agy-dismiss-all":
          clearAutoCollapseTimer();
          state.alerts = [];
          state.activeAlertId = "";
          postHost({ type: "agy_dismiss_all" });
          resolveAutoView(false, "");
          render(true);
          break;
        case "history-restore":
          state.pinned = true;
          armAutoCollapse(60000);
          postHost({ type: "history_restore", id });
          break;
        case "copy-alert":
          state.pinned = true;
          armAutoCollapse(60000);
          postHost({ type: "copy_text", text: target.getAttribute("data-text") || "" });
          state.copyTip = "ok";
          render(true);
          setTimeout(() => { state.copyTip = ""; render(true); }, 1200);
          break;
        case "health-countdown":
          startOrResumeCountdown(parseInt(target.getAttribute("data-sec") || "30", 10));
          break;
        case "health-done":
          resetCountdown();
          state.ctxOpen = false;
          state.manualHealthOpen = false;
          state.health.alertActive = false;
          state.health.seatedSeconds = 0;
          state.health.snoozed = false;
          state.health.todayCount = (state.health.todayCount || 0) + 1;
          postHost({ type: "health_done" });
          const nextTop = state.alerts[0];
          const nextLvl = getAlertLevel(nextTop);
          if (nextTop && nextLvl >= 2) {
            state.view = "agy";
            state.activeAlertId = nextTop.id;
            state.pinned = false;
            armAutoCollapse(nextLvl >= 3 ? 30000 : 8000);
          } else {
            state.view = "compact";
            state.pinned = false;
            clearAutoCollapseTimer();
          }
          render(true);
          break;
        case "health-shuffle":
          resetCountdown();
          state.pinned = true;
          state.manualHealthOpen = true;
          state.health.actionIndex = (state.health.actionIndex + 1) % ACTIONS.length;
          armAutoCollapse(60000);
          postHost({ type: "health_shuffle" });
          render(true);
          break;
        case "health-snooze":
          resetCountdown();
          clearAutoCollapseTimer();
          state.manualHealthOpen = false;
          state.health.alertActive = false;
          state.health.snoozed = true;
          postHost({ type: "health_snooze", minutes: 5 });
          state.view = "compact";
          state.pinned = false;
          render(true);
          break;
        case "set-interval":
          const mins = parseInt(target.getAttribute("data-val") || "50", 10);
          state.health.intervalMinutes = mins;
          postHost({ type: "set_interval", minutes: mins });
          render(true);
          break;
        case "set-language":
          const langPref = target.getAttribute("data-val") || "auto";
          applyLocalLanguage(langPref, "");
          try { localStorage.setItem("agentisland_lang", state.language); } catch (e) {}
          postHost({ type: "set_language", language: state.language });
          render(true);
          break;
        case "toggle-mute":
          state.muted = !state.muted;
          postHost({ type: "toggle_mute" });
          render(true);
          break;
        case "toggle-pause":
          state.health.paused = !state.health.paused;
          postHost({ type: "toggle_pause" });
          render(true);
          break;
      }
    });

    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener("message", (event) => {
        const msg = event.data;
        if (!msg) return;
        if (msg.type === "state") {
          state.nowMs = msg.nowMs || Date.now();
          if (Array.isArray(msg.actions) && msg.actions.length > 0) {
            ACTIONS = msg.actions;
          }
          state.health = msg.health || state.health;
          state.alerts = Array.isArray(msg.alerts) ? msg.alerts : [];
          state.working = Array.isArray(msg.working) ? msg.working : [];
          state.history = Array.isArray(msg.history) ? msg.history : [];
          state.muted = !!msg.muted;
          if (typeof msg.language === "string") {
            applyLocalLanguage(msg.language, msg.resolvedLanguage || "");
          }
          resolveAutoView(!!msg.triggerExpand, msg.focusKind || "");
          render(false);
        } else if (msg.type === "toast") {
          showToast(msg.text || "");
        } else if (msg.type === "command") {
          clearHoverTimers();
          if (msg.command === "outside_click") {
            let needRender = false;
            if (state.ctxOpen) {
              state.ctxOpen = false;
              needRender = true;
            }
            // Clicking anywhere outside collapses any expanded card immediately (unless actively counting down a workout)
            if (state.view !== "compact" && !state.countdown.active) {
              clearAutoCollapseTimer();
              state.manualHealthOpen = false;
              state.pinned = false;
              state.view = "compact";
              needRender = true;
            }
            if (needRender) render(true);
            return;
          }
          state.ctxOpen = false;
          if (msg.command === "open_overview") {
            state.manualHealthOpen = false;
            state.view = "overview";
            state.pinned = true;
            armAutoCollapse(60000);
            render(true);
          } else if (msg.command === "toggle_overview") {
            if (state.view === "compact") {
              state.view = state.alerts.length > 0 ? "agy" : (state.health.alertActive ? "health" : "overview");
              state.pinned = true;
              if (state.view === "agy" && state.alerts.length > 0) {
                state.activeAlertId = state.alerts[0].id;
              }
              armAutoCollapse(60000);
            } else {
              resetCountdown();
              clearAutoCollapseTimer();
              state.manualHealthOpen = false;
              state.view = "compact";
              state.pinned = false;
            }
            render(true);
          }
        }
      });
    }

    // White-box telemetry hook for automated UX regression verification
    window.__uxDebug = () => ({
      view: state.view,
      pinned: state.pinned,
      manualHealthOpen: state.manualHealthOpen,
      ctxOpen: state.ctxOpen,
      activeAlertId: state.activeAlertId,
      tickerIdx: state.tickerIdx,
      countdownActive: state.countdown.active,
      countdownPaused: state.countdown.paused,
      countdownRemain: state.countdown.remain,
      autoCollapseMs: autoCollapseMs,
      toastText: state.toastText
    });

    render(true);
  </script>
</body>
</html>
