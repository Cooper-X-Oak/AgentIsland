<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentIsland</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      color: #f4f4f5;
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 16px;
      background: transparent !important;
    }

    .dock {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
      background: transparent !important;
    }

    .dock.merged {
      gap: 0;
    }

    .island {
      position: relative;
      background: linear-gradient(180deg, rgba(19, 21, 28, 0.97) 0%, rgba(10, 11, 15, 0.98) 100%);
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.34),
        0 2px 4px rgba(0, 0, 0, 0.24),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
      overflow: hidden;
      width: 210px;
      height: 36px;
      border-radius: 18px;
      transition:
        width 340ms cubic-bezier(0.22, 1, 0.36, 1),
        height 340ms cubic-bezier(0.22, 1, 0.36, 1),
        border-radius 340ms cubic-bezier(0.22, 1, 0.36, 1),
        border-color 240ms ease,
        box-shadow 240ms ease;
      will-change: width, height, border-radius;
    }

    .island.compact-hover:hover {
      border-color: rgba(255, 255, 255, 0.32);
    }

    .island.glow-green {
      border-color: rgba(34, 197, 94, 0.68);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.36),
        0 0 10px rgba(34, 197, 94, 0.24),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
    }

    .island.glow-amber {
      border-color: rgba(245, 158, 11, 0.74);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.36),
        0 0 10px rgba(245, 158, 11, 0.26),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
    }

    .island.glow-blue {
      border-color: rgba(59, 130, 246, 0.68);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.36),
        0 0 10px rgba(59, 130, 246, 0.24),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
    }

    .island.glow-red {
      border-color: rgba(239, 68, 68, 0.76);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.36),
        0 0 10px rgba(239, 68, 68, 0.26),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
    }

    /* Right detached Split Pill Health Orb */
    .health-orb {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(19, 21, 28, 0.97) 0%, rgba(10, 11, 15, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.34),
        0 2px 4px rgba(0, 0, 0, 0.24),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      overflow: hidden;
      transition:
        width 260ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 200ms ease,
        transform 260ms cubic-bezier(0.22, 1, 0.36, 1),
        border-color 240ms ease,
        box-shadow 240ms ease;
    }

    .health-orb:hover {
      border-color: rgba(255, 255, 255, 0.35);
    }

    .health-orb.orb-alert {
      border-color: rgba(34, 197, 94, 0.78);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.36),
        0 0 10px rgba(34, 197, 94, 0.34);
    }

    .health-orb.hidden-orb {
      width: 0;
      opacity: 0;
      border-width: 0;
      box-shadow: none;
      pointer-events: none;
      transform: scale(0.7);
    }

    .orb-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .orb-label {
      position: relative;
      z-index: 1;
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f4f4f5;
      line-height: 1;
    }

    .content-enter {
      animation: fadeSoft 160ms ease-out;
    }

    @keyframes fadeSoft {
      from { opacity: 0.35; }
      to   { opacity: 1; }
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.8); }
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-pulse {
      animation: pulseDot 1.35s ease-in-out infinite;
    }

    /* Compact Left Pill */
    .pill-bar {
      height: 36px;
      padding: 0 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      cursor: pointer;
    }

    .pill-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .pill-text {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .mini-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      line-height: 1.4;
    }

    .muted-tag {
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.52);
      font-variant-numeric: tabular-nums;
    }

    /* Expanded Cards */
    .card {
      padding: 13px 15px 13px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: grab;
    }

    .card-top:active {
      cursor: grabbing;
    }

    .card-top-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      flex-shrink: 0;
      border: 1px solid transparent;
    }

    .project-name {
      font-size: 12.5px;
      font-weight: 700;
      color: #fafafa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source-sub {
      font-size: 11px;
      font-weight: 500;
      color: #a1a1aa;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card-top-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .meta-text {
      font-size: 11px;
      color: #a1a1aa;
      font-variant-numeric: tabular-nums;
    }

    .icon-btn {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: none;
      background: rgba(255, 255, 255, 0.09);
      color: #d4d4d8;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 150ms, color 150ms;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .main-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .summary {
      font-size: 12.5px;
      color: #e4e4e7;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .toast-line {
      font-size: 11px;
      color: #fbbf24;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub-tip {
      font-size: 11.5px;
      color: #a1a1aa;
      line-height: 1.38;
      margin-top: 2px;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 2px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button.btn {
      border: none;
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 140ms, background 140ms;
      position: relative;
      overflow: hidden;
    }

    button.btn:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.13);
      color: #f4f4f5;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.07);
      color: #a1a1aa;
    }

    .switch-chip {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.09);
      color: #f4f4f5;
      cursor: pointer;
      flex-shrink: 0;
    }

    .switch-chip:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Countdown bar */
    .countdown-track {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      margin-top: 4px;
    }

    .countdown-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transition: width 250ms linear;
    }

    /* Overview rows */
    .ov-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ov-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.055);
      font-size: 11.5px;
    }

    .ov-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ov-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 9px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 11.5px;
    }

    .ov-item-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .ov-item-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e4e4e7;
    }

    .int-chips {
      display: inline-flex;
      gap: 3px;
    }

    .int-chip {
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #a1a1aa;
      cursor: pointer;
    }

    .int-chip.active {
      border-color: rgba(34, 197, 94, 0.65);
      background: rgba(34, 197, 94, 0.18);
      color: #4ade80;
      font-weight: 700;
    }

    /* Inline Right-Click Context Menu */
    .ctx-menu {
      margin-top: 8px;
      width: 248px;
      border-radius: 14px;
      background: rgba(16, 18, 24, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.42);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 3px;
      animation: fadeSoft 130ms ease-out;
    }

    .ctx-menu.open {
      display: flex;
    }

    .ctx-btn {
      width: 100%;
      border: none;
      background: transparent;
      color: #e4e4e7;
      font-size: 12px;
      font-family: inherit;
      padding: 6px 9px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ctx-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .ctx-row {
      padding: 5px 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: #a1a1aa;
    }

    .ctx-sep {
      height: 1px;
      background: rgba(255, 255, 255, 0.09);
      margin: 2px 4px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div id="dock" class="dock">
      <div id="main-island" class="island compact-hover"></div>
      <div id="health-orb" class="health-orb" title="点击打开护腰行动卡 · 右键快捷菜单"></div>
    </div>
    <div id="ctx-menu" class="ctx-menu"></div>
  </div>

  <script>
    let ACTIONS = [
      { title: "原地深蹲 15 个", seconds: 45, tip: "膝盖对准脚尖、臀部往后坐，唤醒久坐睡死的臀肌" },
      { title: "麦肯基俯卧轻撑", seconds: 30, tip: "手肘撑稳微微抬头，骨盆贴地放松，给腰椎反向减压" },
      { title: "站起来接水 + 远眺", seconds: 120, tip: "离开椅子走两步，顺便让睫状肌松一口气" },
      { title: "靠墙静蹲", seconds: 45, tip: "后背贴实墙面、小腿垂直地面，稳住核心不塌腰" },
      { title: "站立扩胸 + 绕肩", seconds: 60, tip: "双手背后相扣轻轻拉开胸腔，对抗低头圆肩" },
      { title: "踮脚提踵 25 次", seconds: 40, tip: "站直慢起慢落，促进下肢血液回流" }
    ];

    const state = {
      nowMs: Date.now(),
      health: {
        seatedSeconds: 0,
        intervalMinutes: 50,
        todayCount: 0,
        alertActive: false,
        actionIndex: 0,
        snoozed: false,
        paused: false,
        pauseRemainMinutes: 0,
        isLateNight: false
      },
      alerts: [],
      working: [],
      history: [],
      muted: false,
      view: "compact", // compact | agy | health | overview
      pinned: false,
      manualHealthOpen: false,
      ctxOpen: false,
      activeAlertId: "",
      countdown: {
        active: false,
        paused: false,
        total: 0,
        remain: 0
      },
      copyTip: "",
      toastText: ""
    };

    const dock = document.getElementById("dock");
    const mainIsland = document.getElementById("main-island");
    const healthOrb = document.getElementById("health-orb");
    const ctxMenu = document.getElementById("ctx-menu");

    let lastRenderKey = "";
    let lastViewMode = "";
    let hoverOpenTimer = null;
    let hoverCloseTimer = null;
    let softCollapseTimer = null;
    let toastTimer = null;
    let countdownInterval = null;
    let hitRectTimer = null;
    let pointerInsideDock = false;

    function postHost(msg) {
      try {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(msg);
        }
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getSourceLabel(source) {
      if (!source || source === "antigravity") return "AGY";
      if (source === "ClaudeCode") return "Claude";
      if (source === "Codex") return "Codex";
      return source;
    }

    function getSessionLabel(item) {
      if (!item) return "Agent";
      return item.sessionName || item.project || getSourceLabel(item.source);
    }

    function getSubMeta(item) {
      if (!item) return "";
      const primary = getSessionLabel(item);
      const src = item.source || "antigravity";
      if (src !== "antigravity") {
        const srcLabel = getSourceLabel(src);
        return primary.toLowerCase() === srcLabel.toLowerCase() ? "" : ` · ${srcLabel}`;
      }
      if (item.project && item.project !== primary && item.project !== "Antigravity") {
        return ` · ${item.project}`;
      }
      return "";
    }

    function isStrongKind(kind) {
      return kind === "error" || kind === "needs_approval" || kind === "needs_decision";
    }

    function formatWait(ts) {
      if (!ts) return "刚刚";
      const sec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      if (sec < 45) return "刚刚";
      const m = Math.floor(sec / 60);
      if (m < 60) return `已等 ${m}m`;
      return `已等 ${Math.floor(m / 60)}h${m % 60}m`;
    }

    function getAlertStyle(kind) {
      if (kind === "error") {
        return { color: "#ef4444", textColor: "#ffffff", glow: "glow-red", label: "报错卡住" };
      }
      if (kind === "needs_approval") {
        return { color: "#f97316", textColor: "#09090b", glow: "glow-amber", label: "待批准命令" };
      }
      if (kind === "needs_decision") {
        return { color: "#f59e0b", textColor: "#09090b", glow: "glow-amber", label: "等你拍板" };
      }
      return { color: "#3b82f6", textColor: "#ffffff", glow: "glow-blue", label: "等你回复" };
    }

    function getActiveAlert() {
      if (state.alerts.length === 0) {
        state.activeAlertId = "";
        return { item: null, idx: 0 };
      }
      let idx = state.alerts.findIndex(a => a.id === state.activeAlertId);
      if (idx < 0) {
        idx = 0;
        state.activeAlertId = state.alerts[0].id;
      }
      return { item: state.alerts[idx], idx };
    }

    function computeMainSize(view) {
      if (view === "agy") return { w: 438, h: state.toastText ? 148 : 132, r: 22 };
      if (view === "health") return { w: 438, h: 158, r: 22 };
      if (view === "overview") return { w: 438, h: 230, r: 22 };
      if (state.alerts.length > 0) return { w: 256, h: 36, r: 18 };
      if (state.working.length > 0) return { w: 256, h: 36, r: 18 };
      return { w: 190, h: 36, r: 18 };
    }

    function reportHitRectsNow() {
      const rects = [];
      const addRect = (el, pad) => {
        if (!el) return null;
        const r = el.getBoundingClientRect();
        if (r.width > 4 && r.height > 4) {
          const box = {
            x: Math.round(r.left - pad),
            y: Math.round(r.top - pad),
            w: Math.round(r.width + pad * 2),
            h: Math.round(r.height + pad * 2)
          };
          rects.push(box);
          return box;
        }
        return null;
      };
      const mainBox = addRect(mainIsland, 1);
      if (state.view === "compact" && !healthOrb.classList.contains("hidden-orb")) {
        addRect(healthOrb, 1);
      }
      if (state.ctxOpen) {
        const ctxBox = addRect(ctxMenu, 2);
        // Bridge the 8px vertical gap between pill/card and open context menu so moving downward never flickers
        if (mainBox && ctxBox && ctxBox.y > mainBox.y + mainBox.h) {
          rects.push({
            x: Math.min(mainBox.x, ctxBox.x),
            y: mainBox.y + mainBox.h - 1,
            w: Math.max(mainBox.x + mainBox.w, ctxBox.x + ctxBox.w) - Math.min(mainBox.x, ctxBox.x),
            h: ctxBox.y - (mainBox.y + mainBox.h) + 2
          });
        }
      }
      postHost({
        type: "hit_rects",
        dpr: window.devicePixelRatio || 1,
        rects: rects
      });
    }

    function scheduleHitRectSync() {
      requestAnimationFrame(() => reportHitRectsNow());
      if (hitRectTimer) clearTimeout(hitRectTimer);
      hitRectTimer = setTimeout(reportHitRectsNow, 370);
    }

    function clearSoftCollapseTimer() {
      if (softCollapseTimer) {
        clearTimeout(softCollapseTimer);
        softCollapseTimer = null;
      }
    }

    function armSoftCollapseTimer(delayMs) {
      clearSoftCollapseTimer();
      softCollapseTimer = setTimeout(() => {
        softCollapseTimer = null;
        if (state.view === "agy" && !state.pinned && !pointerInsideDock && !state.ctxOpen) {
          const active = getActiveAlert().item;
          if (!active || !isStrongKind(active.kind)) {
            state.view = "compact";
            render(true);
          }
        }
      }, delayMs || 6000);
    }

    function showToast(text) {
      state.toastText = text || "";
      if (toastTimer) clearTimeout(toastTimer);
      render(true);
      if (state.toastText) {
        toastTimer = setTimeout(() => {
          toastTimer = null;
          state.toastText = "";
          render(true);
        }, 2600);
      }
    }

    // ==================== Countdown (True Pause / Resume) ====================

    function resetCountdown() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      state.countdown.active = false;
      state.countdown.paused = false;
      state.countdown.total = 0;
      state.countdown.remain = 0;
    }

    function pauseCountdown() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      state.countdown.active = false;
      state.countdown.paused = state.countdown.remain > 0;
      render(true);
    }

    function startOrResumeCountdown(seconds) {
      if (state.countdown.active) {
        pauseCountdown();
        return;
      }
      if (!state.countdown.paused || state.countdown.remain <= 0) {
        state.countdown.total = seconds;
        state.countdown.remain = seconds;
      }
      state.countdown.active = true;
      state.countdown.paused = false;
      state.pinned = true;
      state.manualHealthOpen = true;
      clearSoftCollapseTimer();
      render(true);

      countdownInterval = setInterval(() => {
        state.countdown.remain--;
        if (state.countdown.remain <= 0) {
          resetCountdown();
          postHost({ type: "play_done_chime" });
          state.manualHealthOpen = false;
          state.health.alertActive = false;
          state.health.seatedSeconds = 0;
          state.health.snoozed = false;
          state.health.todayCount = (state.health.todayCount || 0) + 1;
          postHost({ type: "health_done" });
          if (state.alerts.length > 0) {
            state.view = "agy";
            const top = getActiveAlert().item;
            state.pinned = !!(top && isStrongKind(top.kind));
            if (!state.pinned) armSoftCollapseTimer(6000);
          } else {
            state.view = "compact";
            state.pinned = false;
          }
          render(true);
        } else {
          updateCountdownDom();
        }
      }, 1000);
    }

    function updateCountdownDom() {
      const btn = document.getElementById("btn-countdown");
      const fill = document.getElementById("countdown-fill");
      if (!btn || !fill) return;
      if (state.countdown.active) {
        const pct = Math.max(0, Math.min(100, Math.round(((state.countdown.total - state.countdown.remain) / state.countdown.total) * 100)));
        btn.textContent = `跟练中 ${state.countdown.remain}s（点暂停）`;
        fill.style.width = pct + "%";
      }
    }

    // ==================== Render Helpers ====================

    function renderHealthOrb() {
      const showOrb = (state.view === "compact");
      dock.classList.toggle("merged", !showOrb);
      healthOrb.classList.toggle("hidden-orb", !showOrb);

      const mins = Math.floor(state.health.seatedSeconds / 60);
      const interval = state.health.intervalMinutes || 50;
      const pct = Math.min(1, state.health.seatedSeconds / (interval * 60));
      const r = 13.5;
      const circ = 2 * Math.PI * r;
      const dashOffset = (circ * (1 - pct)).toFixed(2);

      let strokeColor = "#22c55e";
      let label = String(mins);
      if (state.health.paused) {
        strokeColor = "#71717a";
        label = "停";
      } else if (state.health.snoozed) {
        strokeColor = "#f59e0b";
        label = "+5";
      } else if (state.health.alertActive || pct >= 1) {
        strokeColor = "#4ade80";
        label = "起";
      } else if (pct >= 0.8) {
        strokeColor = "#f59e0b";
      }

      healthOrb.classList.toggle("orb-alert", !!state.health.alertActive);
      healthOrb.innerHTML = `
        <svg class="orb-svg" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="${r}" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2.6"></circle>
          <circle cx="18" cy="18" r="${r}" fill="none" stroke="${strokeColor}" stroke-width="2.6" stroke-linecap="round"
            stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${dashOffset}" style="transition:stroke-dashoffset 350ms ease,stroke 250ms ease;"></circle>
        </svg>
        <span class="orb-label" style="color:${state.health.alertActive ? '#4ade80' : '#f4f4f5'}">${label}</span>`;
    }

    function renderContextMenu() {
      ctxMenu.classList.toggle("open", state.ctxOpen);
      if (!state.ctxOpen) {
        ctxMenu.innerHTML = "";
        return;
      }
      const curInt = state.health.intervalMinutes || 50;
      const intervals = [30, 45, 50, 60].map(m =>
        `<button class="int-chip ${curInt === m ? 'active' : ''}" data-action="set-interval" data-val="${m}">${m}m</button>`
      ).join("");
      const pauseLabel = state.health.paused
        ? `▶ 恢复护腰提醒（剩 ${state.health.pauseRemainMinutes || 1}m）`
        : "⏸ 暂停护腰 1 小时";
      ctxMenu.innerHTML = `
        <button class="ctx-btn" data-action="health-done"><span>✓ 刚站过（清零 + 今日打卡）</span><span class="meta-text">${state.health.todayCount}次</span></button>
        <div class="ctx-row"><span>⏱ 久坐间隔</span><div class="int-chips">${intervals}</div></div>
        <div class="ctx-sep"></div>
        <button class="ctx-btn" data-action="toggle-pause"><span>${pauseLabel}</span></button>
        <button class="ctx-btn" data-action="toggle-mute"><span>${state.muted ? '🔊 开启提示音' : '🔕 静音提示音'}</span></button>
        <button class="ctx-btn" data-action="open-health-pin"><span>🏋 立即做一组护腰动作</span></button>
        <div class="ctx-sep"></div>
        <button class="ctx-btn" data-action="close-ctx"><span style="color:#a1a1aa">关闭菜单</span><span class="meta-text">Alt+\\</span></button>`;
    }

    // ==================== Priority Arbiter ====================

    function resolveAutoView(triggerExpand, focusKind) {
      const countdownProtected = (state.view === "health" && (state.countdown.active || state.countdown.paused));

      if (triggerExpand) {
        state.ctxOpen = false;

        if (focusKind === "agy" && state.alerts.length > 0) {
          // Never interrupt an active or paused health workout countdown!
          if (countdownProtected) return;

          const top = state.alerts[0];
          const strong = isStrongKind(top.kind);

          // If user is already inspecting a pinned alert card, don't yank their cursor unless a stronger alert arrived
          if (state.view === "agy" && state.pinned && state.activeAlertId && !strong) {
            if (state.alerts.some(a => a.id === state.activeAlertId)) {
              return;
            }
          }

          state.view = "agy";
          state.activeAlertId = top.id;
          state.manualHealthOpen = false;
          if (strong) {
            state.pinned = true;
            clearSoftCollapseTimer();
          } else {
            state.pinned = false;
            armSoftCollapseTimer(6000);
          }
          return;
        }

        if (focusKind === "health" && state.health.alertActive) {
          state.view = "health";
          state.pinned = true;
          state.manualHealthOpen = false;
          clearSoftCollapseTimer();
          return;
        }
      }

      // Guard: if viewing agy and queue became empty, step down cleanly
      if (state.view === "agy" && state.alerts.length === 0) {
        clearSoftCollapseTimer();
        state.activeAlertId = "";
        state.view = state.health.alertActive ? "health" : "compact";
        state.pinned = state.health.alertActive;
      }

      // Guard: ONLY auto-close health if it was auto-opened (never yank a manually opened health card!)
      if (state.view === "health" && !state.manualHealthOpen && !state.health.alertActive && !state.countdown.active && !state.countdown.paused) {
        if (state.alerts.length > 0) {
          const top = getActiveAlert().item;
          state.view = "agy";
          state.pinned = !!(top && isStrongKind(top.kind));
          if (!state.pinned) armSoftCollapseTimer(6000);
        } else {
          state.view = "compact";
          state.pinned = false;
        }
      }
    }

    function render(forceHtml) {
      const target = computeMainSize(state.view);
      mainIsland.style.width = target.w + "px";
      mainIsland.style.height = target.h + "px";
      mainIsland.style.borderRadius = target.r + "px";

      const viewChanged = (state.view !== lastViewMode);
      if (viewChanged && lastViewMode === "health") {
        resetCountdown();
        state.manualHealthOpen = false;
      }
      if (viewChanged && lastViewMode === "agy") {
        clearSoftCollapseTimer();
        state.toastText = "";
      }
      lastViewMode = state.view;
      const enterCls = viewChanged ? " content-enter" : "";

      mainIsland.className = "island" + (state.view === "compact" ? " compact-hover" : "");

      const mins = Math.floor(state.health.seatedSeconds / 60);
      const interval = state.health.intervalMinutes || 50;

      let html = "";
      let renderKey = "";

      if (state.view === "compact") {
        if (state.alerts.length > 0) {
          const top = state.alerts[0];
          const st = getAlertStyle(top.kind);
          const sessionTitle = getSessionLabel(top);
          mainIsland.classList.add(st.glow);
          renderKey = `compact-alert-${top.id}-${top.kind}-${sessionTitle}-${state.alerts.length}`;
          html = `
            <div class="pill-bar${enterCls}" data-action="open-agy-pin" data-id="${escapeHtml(top.id)}">
              <div class="pill-left">
                <span class="dot dot-pulse" style="background:${st.color}"></span>
                <span class="pill-text">${escapeHtml(top.title || st.label)} · ${escapeHtml(sessionTitle)}</span>
              </div>
              <div class="pill-right">
                <span class="mini-badge" style="background:${st.color}26;color:${st.color}">${state.alerts.length}</span>
              </div>
            </div>`;
        } else if (state.working.length > 0) {
          mainIsland.classList.add("glow-blue");
          const wCount = state.working.length;
          const firstSrc = getSourceLabel(state.working[0].source);
          const allSameSrc = state.working.every(w => getSourceLabel(w.source) === firstSrc);
          const srcPrefix = allSameSrc ? firstSrc : "Agent";
          const label = wCount === 1
            ? `${srcPrefix} 思考中 · ${getSessionLabel(state.working[0])}`
            : `${srcPrefix} 思考中 · ${wCount} 个会话`;
          renderKey = `compact-work-${wCount}-${label}`;
          html = `
            <div class="pill-bar${enterCls}" data-action="open-overview-pin">
              <div class="pill-left">
                <span class="dot dot-pulse" style="background:#3b82f6"></span>
                <span class="pill-text">${escapeHtml(label)}</span>
              </div>
              <div class="pill-right">
                <span class="muted-tag">LIVE</span>
              </div>
            </div>`;
        } else {
          renderKey = `compact-idle-${state.health.todayCount}-${state.muted}`;
          html = `
            <div class="pill-bar${enterCls}" data-action="open-overview-pin">
              <div class="pill-left">
                <span class="dot" style="background:#22c55e"></span>
                <span class="pill-text">Agent 待命</span>
              </div>
              <div class="pill-right">
                <span class="muted-tag">${state.muted ? "静音 · " : ""}救腰 ${state.health.todayCount}</span>
              </div>
            </div>`;
        }
      } else if (state.view === "agy") {
        const active = getActiveAlert();
        if (!active.item) {
          state.view = "compact";
          return render(true);
        }
        const item = active.item;
        const idx = active.idx;
        const st = getAlertStyle(item.kind);
        mainIsland.classList.add(st.glow);
        const waitText = formatWait(item.timestamp);
        const sessionTitle = getSessionLabel(item);
        const subMeta = getSubMeta(item);
        const healthChip = state.health.alertActive
          ? `<button class="switch-chip" data-action="open-health-pin">🟢 护腰</button>`
          : "";
        const nextBtn = state.alerts.length > 1
          ? `<button class="btn btn-secondary" data-action="agy-next">下一条 (${idx + 1}/${state.alerts.length})</button>`
          : "";
        const focusLabel = (!item.source || item.source === "antigravity")
          ? "直达该会话 ↗"
          : ((item.source === "ClaudeCode" || item.source === "Codex") ? "切到终端 ↗" : "标记已读 ✓");
        const toastHtml = state.toastText
          ? `<div class="toast-line">⚠ ${escapeHtml(state.toastText)}</div>`
          : "";

        renderKey = `agy-${item.id}-${item.kind}-${sessionTitle}-${subMeta}-${item.summary}-${idx}-${state.alerts.length}-${waitText}-${state.health.alertActive}-${state.copyTip}-${state.toastText}`;
        html = `
          <div class="card${enterCls}">
            <div class="card-top">
              <div class="card-top-left">
                <span class="badge" style="background:${st.color}24;color:${st.color};border-color:${st.color}55">${escapeHtml(item.title || st.label)}</span>
                <span class="project-name">${escapeHtml(sessionTitle)}</span>
                ${subMeta ? `<span class="source-sub">${escapeHtml(subMeta)}</span>` : ""}
              </div>
              <div class="card-top-right">
                ${healthChip}
                <span class="meta-text">${escapeHtml(waitText)}</span>
                <button class="icon-btn" data-action="copy-alert" data-text="${escapeHtml(sessionTitle + ' | ' + item.summary)}" title="复制摘要">${state.copyTip ? '✓' : '⧉'}</button>
                <button class="icon-btn" data-action="collapse" title="收起">−</button>
              </div>
            </div>
            <div>
              <div class="summary">${escapeHtml(item.summary)}</div>
              ${toastHtml}
            </div>
            <div class="actions">
              <button class="btn" style="background:${st.color};color:${st.textColor}" data-action="agy-focus" data-id="${escapeHtml(item.id)}">
                ${focusLabel}
              </button>
              <div class="btn-group">
                ${nextBtn}
                <button class="btn btn-ghost" data-action="agy-dismiss" data-id="${escapeHtml(item.id)}">知道了</button>
              </div>
            </div>
          </div>`;
      } else if (state.view === "health") {
        mainIsland.classList.add("glow-green");
        const act = ACTIONS[state.health.actionIndex % ACTIONS.length];
        const agyChip = state.alerts.length > 0
          ? `<button class="switch-chip" data-action="open-agy-pin">⚡ 待介入 (${state.alerts.length})</button>`
          : "";
        const isDue = !!state.health.alertActive;
        const badgeText = isDue ? `坐满 ${interval}m · 救腰` : "主动加练 · 救腰";
        const metaText = state.health.isLateNight
          ? `已过凌晨 · 今日第 ${state.health.todayCount + 1} 次`
          : (isDue
              ? `已连坐 ${Math.max(mins, interval)}m · 今日 ${state.health.todayCount} 次`
              : `当前已坐 ${mins}m · 今日 ${state.health.todayCount} 次`);

        const cdPct = (state.countdown.active || state.countdown.paused) && state.countdown.total > 0
          ? Math.round(((state.countdown.total - state.countdown.remain) / state.countdown.total) * 100)
          : 0;
        let cdLabel = `开始跟练 ${act.seconds}s ▶`;
        if (state.countdown.active) {
          cdLabel = `跟练中 ${state.countdown.remain}s（点暂停）`;
        } else if (state.countdown.paused) {
          cdLabel = `已暂停 ${state.countdown.remain}s（继续 ▶）`;
        }

        renderKey = `health-${state.health.actionIndex}-${state.alerts.length}-${mins}-${isDue}-${state.health.todayCount}-${state.countdown.active}-${state.countdown.paused}-${state.countdown.remain}`;
        html = `
          <div class="card${enterCls}">
            <div class="card-top">
              <div class="card-top-left">
                <span class="badge" style="background:rgba(34,197,94,0.2);color:#4ade80;border-color:rgba(34,197,94,0.45)">${escapeHtml(badgeText)}</span>
              </div>
              <div class="card-top-right">
                ${agyChip}
                <span class="meta-text">${escapeHtml(metaText)}</span>
                <button class="icon-btn" data-action="collapse" title="收起">−</button>
              </div>
            </div>
            <div>
              <div class="main-title">${escapeHtml(act.title)}（${act.seconds} 秒）</div>
              <div class="sub-tip">${escapeHtml(act.tip)}</div>
              <div class="countdown-track"><div id="countdown-fill" class="countdown-fill" style="width:${cdPct}%"></div></div>
            </div>
            <div class="actions">
              <button id="btn-countdown" class="btn" style="background:#22c55e;color:#052e16" data-action="health-countdown" data-sec="${act.seconds}">
                ${cdLabel}
              </button>
              <div class="btn-group">
                <button class="btn btn-secondary" data-action="health-done">已动 ✓</button>
                <button class="btn btn-secondary" data-action="health-shuffle">换</button>
                <button class="btn btn-ghost" data-action="health-snooze">+5m</button>
              </div>
            </div>
          </div>`;
      } else if (state.view === "overview") {
        const curInt = state.health.intervalMinutes || 50;
        const intervals = [30, 45, 50, 60].map(m =>
          `<button class="int-chip ${curInt === m ? 'active' : ''}" data-action="set-interval" data-val="${m}">${m}m</button>`
        ).join("");

        let listHtml = "";
        if (state.alerts.length > 0) {
          listHtml += state.alerts.slice(0, 2).map(a => {
            const st = getAlertStyle(a.kind);
            const sName = getSessionLabel(a);
            return `<div class="ov-item">
              <div class="ov-item-left"><span class="dot dot-pulse" style="background:${st.color}"></span><span class="ov-item-text"><strong>${escapeHtml(sName)}</strong> · ${escapeHtml(a.title || st.label)}（${formatWait(a.timestamp)}）</span></div>
              <button class="switch-chip" data-action="open-agy-pin" data-id="${escapeHtml(a.id)}">处理</button>
            </div>`;
          }).join("");
          if (state.alerts.length > 2) {
            listHtml += `<div class="ov-item">
              <span class="meta-text">还有 ${state.alerts.length - 2} 条待介入通知</span>
              <button class="switch-chip" data-action="agy-dismiss-all">全部已读</button>
            </div>`;
          }
        } else if (state.working.length > 0) {
          listHtml += state.working.slice(0, 2).map(w =>
            `<div class="ov-item">
              <div class="ov-item-left"><span class="dot dot-pulse" style="background:#3b82f6"></span><span class="ov-item-text"><strong>${escapeHtml(getSessionLabel(w))}</strong> · ${escapeHtml(getSourceLabel(w.source))} 思考中</span></div>
              <span class="meta-text">运行中</span>
            </div>`
          ).join("");
        }

        if (state.history.length > 0 && state.alerts.length <= 2) {
          const h = state.history[0];
          listHtml += `<div class="ov-item">
            <div class="ov-item-left"><span class="dot" style="background:#71717a"></span><span class="ov-item-text" style="color:#a1a1aa">最近已看：${escapeHtml(getSessionLabel(h))} · ${escapeHtml(h.title || h.summary)}</span></div>
            <button class="switch-chip" data-action="history-restore" data-id="${escapeHtml(h.id)}">恢复</button>
          </div>`;
        } else if (!listHtml) {
          listHtml = `<div class="ov-item"><span class="meta-text">暂无活跃或历史待介入会话 · 快捷键 Alt+\\ 随时唤出</span></div>`;
        }

        const pauseText = state.health.paused
          ? `（暂停剩 ${state.health.pauseRemainMinutes || 1}m）`
          : "";

        renderKey = `ov-${mins}-${curInt}-${state.health.todayCount}-${state.alerts.length}-${state.working.length}-${state.history.length}-${state.muted}-${state.health.paused}-${state.health.pauseRemainMinutes}`;
        html = `
          <div class="card${enterCls}">
            <div class="card-top">
              <div class="card-top-left">
                <span class="dot" style="background:#22c55e"></span>
                <span class="project-name">灵动岛总览</span>
                <span class="meta-text">· 今日救腰 ${state.health.todayCount} 次</span>
              </div>
              <div class="card-top-right">
                ${state.alerts.length > 1 ? `<button class="switch-chip" data-action="agy-dismiss-all">全部已读</button>` : `<span class="meta-text">右键 · Alt+\\</span>`}
                <button class="icon-btn" data-action="collapse" title="收起">−</button>
              </div>
            </div>
            <div class="ov-grid">
              <div class="ov-row">
                <span>🪑 坐姿 <strong>${mins}/${curInt}m</strong>${pauseText}</span>
                <div class="int-chips">${intervals}</div>
              </div>
              <div class="ov-list">${listHtml}</div>
            </div>
            <div class="actions">
              <button class="btn" style="background:#22c55e;color:#052e16" data-action="open-health-pin">立即做一组护腰</button>
              <div class="btn-group">
                <button class="btn btn-secondary" data-action="health-done">刚站过 +1</button>
                <button class="btn btn-ghost" data-action="toggle-pause">${state.health.paused ? '恢复' : '暂停1h'}</button>
                <button class="btn btn-ghost" data-action="toggle-mute">${state.muted ? '开音' : '静音'}</button>
              </div>
            </div>
          </div>`;
      }

      if (forceHtml || renderKey !== lastRenderKey) {
        lastRenderKey = renderKey;
        mainIsland.innerHTML = html;
      }

      renderHealthOrb();
      renderContextMenu();
      scheduleHitRectSync();
    }

    // ==================== Hover Preview (Only When Alerts Exist) ====================

    function clearHoverTimers() {
      if (hoverOpenTimer) { clearTimeout(hoverOpenTimer); hoverOpenTimer = null; }
      if (hoverCloseTimer) { clearTimeout(hoverCloseTimer); hoverCloseTimer = null; }
    }

    dock.addEventListener("mouseenter", () => {
      pointerInsideDock = true;
      if (hoverCloseTimer) { clearTimeout(hoverCloseTimer); hoverCloseTimer = null; }
      // Pause soft auto-collapse while reading the card
      if (state.view === "agy" && softCollapseTimer) {
        clearSoftCollapseTimer();
      }
      // Rule A1: Only auto-expand on hover when there are pending alerts (never accidentally pop 230px overview over browser tabs!)
      if (state.view === "compact" && !state.ctxOpen && state.alerts.length > 0 && !hoverOpenTimer) {
        hoverOpenTimer = setTimeout(() => {
          hoverOpenTimer = null;
          if (state.view === "compact" && !state.ctxOpen && state.alerts.length > 0) {
            state.pinned = false;
            state.view = "agy";
            state.activeAlertId = state.alerts[0].id;
            render(true);
          }
        }, 260);
      }
    });

    dock.addEventListener("mouseleave", () => {
      pointerInsideDock = false;
      if (hoverOpenTimer) { clearTimeout(hoverOpenTimer); hoverOpenTimer = null; }
      if (state.view !== "compact" && !state.pinned && !state.ctxOpen && !state.countdown.active && !state.countdown.paused) {
        hoverCloseTimer = setTimeout(() => {
          hoverCloseTimer = null;
          if (!state.pinned && !state.ctxOpen && !state.countdown.active && !state.countdown.paused && !pointerInsideDock) {
            state.view = "compact";
            render(true);
          }
        }, 420);
      }
    });

    // Right-click on pill or orb opens inline context menu
    dock.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      clearHoverTimers();
      state.ctxOpen = !state.ctxOpen;
      render(false);
    });

    // Clicking health orb directly opens health break card (manual & pinned)
    healthOrb.addEventListener("click", () => {
      clearHoverTimers();
      clearSoftCollapseTimer();
      state.ctxOpen = false;
      state.manualHealthOpen = true;
      state.view = "health";
      state.pinned = true;
      render(true);
    });

    // Smooth native horizontal drag
    let downX = 0;
    let pressing = false;
    let moved = false;

    mainIsland.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      if (e.target.closest("button")) return;
      pressing = true;
      moved = false;
      downX = e.clientX;
    });

    window.addEventListener("mousemove", (e) => {
      if (!pressing) return;
      if (Math.abs(e.clientX - downX) >= 5) {
        pressing = false;
        moved = true;
        clearHoverTimers();
        postHost({ type: "begin_drag" });
      }
    });

    window.addEventListener("mouseup", () => {
      pressing = false;
      if (moved) setTimeout(() => { moved = false; }, 80);
    });

    // Unified click delegation (island + context menu)
    document.addEventListener("click", (e) => {
      if (moved) return;
      const target = e.target.closest("[data-action]");
      if (!target) {
        if (state.ctxOpen && !e.target.closest("#ctx-menu")) {
          state.ctxOpen = false;
          render(false);
        }
        return;
      }

      clearHoverTimers();
      const action = target.getAttribute("data-action");
      const id = target.getAttribute("data-id") || "";

      switch (action) {
        case "open-agy-pin":
          clearSoftCollapseTimer();
          state.ctxOpen = false;
          state.manualHealthOpen = false;
          state.view = "agy";
          state.pinned = true;
          if (id) {
            state.activeAlertId = id;
          } else if (state.alerts.length > 0) {
            state.activeAlertId = state.alerts[0].id;
          }
          render(true);
          break;
        case "open-health-pin":
          clearSoftCollapseTimer();
          state.ctxOpen = false;
          state.manualHealthOpen = true;
          state.view = "health";
          state.pinned = true;
          render(true);
          break;
        case "open-overview-pin":
          clearSoftCollapseTimer();
          state.ctxOpen = false;
          state.manualHealthOpen = false;
          state.view = "overview";
          state.pinned = true;
          render(true);
          break;
        case "collapse":
          resetCountdown();
          clearSoftCollapseTimer();
          state.ctxOpen = false;
          state.manualHealthOpen = false;
          state.pinned = false;
          state.view = "compact";
          render(true);
          break;
        case "close-ctx":
          state.ctxOpen = false;
          render(false);
          break;
        case "agy-next":
          clearSoftCollapseTimer();
          state.pinned = true;
          if (state.alerts.length > 1) {
            const cur = getActiveAlert().idx;
            state.activeAlertId = state.alerts[(cur + 1) % state.alerts.length].id;
          }
          render(true);
          break;
        case "agy-focus":
          // Let host confirm window focus before archiving; if window not found, host keeps card & sends toast
          clearSoftCollapseTimer();
          state.pinned = true;
          postHost({ type: "agy_focus", id });
          break;
        case "agy-dismiss":
          clearSoftCollapseTimer();
          state.alerts = state.alerts.filter(a => a.id !== id);
          if (state.activeAlertId === id) state.activeAlertId = "";
          postHost({ type: "agy_dismiss", id });
          resolveAutoView(false, "");
          render(true);
          break;
        case "agy-dismiss-all":
          clearSoftCollapseTimer();
          state.alerts = [];
          state.activeAlertId = "";
          postHost({ type: "agy_dismiss_all" });
          resolveAutoView(false, "");
          render(true);
          break;
        case "history-restore":
          clearSoftCollapseTimer();
          state.pinned = true;
          postHost({ type: "history_restore", id });
          break;
        case "copy-alert":
          clearSoftCollapseTimer();
          state.pinned = true;
          postHost({ type: "copy_text", text: target.getAttribute("data-text") || "" });
          state.copyTip = "ok";
          render(true);
          setTimeout(() => { state.copyTip = ""; render(true); }, 1200);
          break;
        case "health-countdown":
          startOrResumeCountdown(parseInt(target.getAttribute("data-sec") || "30", 10));
          break;
        case "health-done":
          resetCountdown();
          state.ctxOpen = false;
          state.manualHealthOpen = false;
          state.health.alertActive = false;
          state.health.seatedSeconds = 0;
          state.health.snoozed = false;
          state.health.todayCount = (state.health.todayCount || 0) + 1;
          postHost({ type: "health_done" });
          if (state.alerts.length > 0) {
            state.view = "agy";
            const top = getActiveAlert().item;
            state.pinned = !!(top && isStrongKind(top.kind));
            if (!state.pinned) armSoftCollapseTimer(6000);
          } else {
            state.view = "compact";
            state.pinned = false;
          }
          render(true);
          break;
        case "health-shuffle":
          resetCountdown();
          state.pinned = true;
          state.manualHealthOpen = true;
          state.health.actionIndex = (state.health.actionIndex + 1) % ACTIONS.length;
          postHost({ type: "health_shuffle" });
          render(true);
          break;
        case "health-snooze":
          resetCountdown();
          state.manualHealthOpen = false;
          state.health.alertActive = false;
          state.health.snoozed = true;
          postHost({ type: "health_snooze", minutes: 5 });
          state.view = state.alerts.length > 0 ? "agy" : "compact";
          state.pinned = state.alerts.length > 0 && isStrongKind(getActiveAlert().item.kind);
          render(true);
          break;
        case "set-interval":
          const mins = parseInt(target.getAttribute("data-val") || "50", 10);
          state.health.intervalMinutes = mins;
          postHost({ type: "set_interval", minutes: mins });
          render(true);
          break;
        case "toggle-mute":
          state.muted = !state.muted;
          postHost({ type: "toggle_mute" });
          render(true);
          break;
        case "toggle-pause":
          state.health.paused = !state.health.paused;
          postHost({ type: "toggle_pause" });
          render(true);
          break;
      }
    });

    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener("message", (event) => {
        const msg = event.data;
        if (!msg) return;
        if (msg.type === "state") {
          state.nowMs = msg.nowMs || Date.now();
          if (Array.isArray(msg.actions) && msg.actions.length > 0) {
            ACTIONS = msg.actions;
          }
          state.health = msg.health || state.health;
          state.alerts = Array.isArray(msg.alerts) ? msg.alerts : [];
          state.working = Array.isArray(msg.working) ? msg.working : [];
          state.history = Array.isArray(msg.history) ? msg.history : [];
          state.muted = !!msg.muted;
          resolveAutoView(!!msg.triggerExpand, msg.focusKind || "");
          render(false);
        } else if (msg.type === "toast") {
          showToast(msg.text || "");
        } else if (msg.type === "command") {
          clearHoverTimers();
          if (msg.command === "outside_click") {
            if (state.ctxOpen) {
              state.ctxOpen = false;
              render(false);
            }
            return;
          }
          state.ctxOpen = false;
          if (msg.command === "open_overview") {
            clearSoftCollapseTimer();
            state.manualHealthOpen = false;
            state.view = "overview";
            state.pinned = true;
            render(true);
          } else if (msg.command === "toggle_overview") {
            if (state.view === "compact") {
              clearSoftCollapseTimer();
              state.view = state.alerts.length > 0 ? "agy" : (state.health.alertActive ? "health" : "overview");
              state.pinned = true;
              if (state.view === "agy" && state.alerts.length > 0) {
                state.activeAlertId = state.alerts[0].id;
              }
            } else {
              resetCountdown();
              clearSoftCollapseTimer();
              state.manualHealthOpen = false;
              state.view = "compact";
              state.pinned = false;
            }
            render(true);
          }
        }
      });
    }

    // White-box telemetry hook for automated UX regression verification
    window.__uxDebug = () => ({
      view: state.view,
      pinned: state.pinned,
      manualHealthOpen: state.manualHealthOpen,
      ctxOpen: state.ctxOpen,
      activeAlertId: state.activeAlertId,
      countdownActive: state.countdown.active,
      countdownPaused: state.countdown.paused,
      countdownRemain: state.countdown.remain,
      softAutoCollapseArmed: !!softCollapseTimer,
      toastText: state.toastText
    });

    render(true);
  </script>
</body>
</html>
