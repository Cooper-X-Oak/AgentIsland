<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 352" width="920" height="352" role="img" aria-label="AgentIsland 端到端原生架构与无端口事件流">
  <defs>
    <marker id="arr-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#60a5fa" />
    </marker>
    <marker id="arr-s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#4ade80" />
    </marker>
    <marker id="arr-w" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#f59e0b" />
    </marker>
    <marker id="arr-m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#8b949e" />
    </marker>
  </defs>

  <style>
    text { font-family: "Microsoft YaHei UI", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>

  <!-- Outer Dark Card Frame (GitHub 浅/深色主题通用) -->
  <rect x="0" y="0" width="920" height="352" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Header -->
  <text x="20" y="27" font-size="13" font-weight="700" fill="#f0f6fc">AgentIsland — 端到端原生架构与无端口事件总线流程图</text>
  <rect x="748" y="13" width="152" height="20" rx="10" fill="rgba(96,165,250,0.14)" stroke="rgba(96,165,250,0.45)" stroke-width="1" />
  <text x="824" y="26.5" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">零 ELECTRON · 45/45</text>

  <!-- 3 Swimlanes -->
  <rect x="14" y="44" width="276" height="294" rx="12" fill="#161b22" stroke="#262c36" stroke-width="1" />
  <text x="26" y="63" font-size="10" font-weight="700" fill="#8b949e" letter-spacing="0.4">01 · 多终端信号采集与适配层</text>

  <rect x="310" y="44" width="300" height="294" rx="12" fill="#161b22" stroke="#262c36" stroke-width="1" />
  <text x="322" y="63" font-size="10" font-weight="700" fill="#8b949e" letter-spacing="0.4">02 · 无端口事件总线与 C# 原生宿主</text>

  <rect x="630" y="44" width="276" height="294" rx="12" fill="#161b22" stroke="#262c36" stroke-width="1" />
  <text x="642" y="63" font-size="10" font-weight="700" fill="#8b949e" letter-spacing="0.4">03 · 独立双胶囊 UI 与直达闭环</text>

  <!-- Bezier Connectors (Col 1 -> Col 2) -->
  <path d="M280,114 C299,114 299,106 318,106" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr-p)" />
  <path d="M280,200 C301,200 301,122 318,122" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr-m)" />
  <path d="M280,286 C301,286 301,264 318,264" fill="none" stroke="#4ade80" stroke-width="1.4" marker-end="url(#arr-s)" />

  <!-- Internal vertical connector (Inbox -> Host) -->
  <path d="M460,152 L460,164" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr-p)" />

  <!-- Bezier Connectors (Col 2 -> Col 3) -->
  <path d="M600,206 C620,206 620,120 638,120" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr-p)" />
  <path d="M600,248 C620,248 620,214 638,214" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-s)" />
  <path d="M600,294 C620,294 620,294 638,294" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-w)" />

  <!-- Column 1 Cards -->
  <rect x="24" y="74" width="256" height="82" rx="10" fill="#0d1117" stroke="rgba(96,165,250,0.6)" stroke-width="1.3" />
  <text x="34" y="93" font-size="11.5" font-weight="700" fill="#f0f6fc">AI 编程终端原生 Hooks</text>
  <text x="34" y="110" font-size="10" fill="#8b949e">• Antigravity / Claude Code / Codex CLI</text>
  <text x="34" y="125" font-size="10" fill="#8b949e">• island-hook.exe 提炼真实标题与 AI 结论</text>
  <text x="34" y="142" font-size="9.5" font-weight="600" fill="#60a5fa">✓ CC/Codex 空 stdout + exit 0 永不误批</text>

  <rect x="24" y="166" width="256" height="68" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <text x="34" y="185" font-size="11.5" font-weight="700" fill="#f0f6fc">通用命令行与脚本推送</text>
  <text x="34" y="202" font-size="10" fill="#8b949e">• island-push.exe --source --title --body</text>
  <text x="34" y="218" font-size="10" fill="#8b949e">• 或任意脚本原子写入 JSON 到收件箱</text>

  <rect x="24" y="244" width="256" height="82" rx="10" fill="#0d1117" stroke="rgba(74,222,128,0.55)" stroke-width="1.3" />
  <text x="34" y="263" font-size="11.5" font-weight="700" fill="#f0f6fc">Win32 真实坐姿与锁屏感应</text>
  <text x="34" y="280" font-size="10" fill="#8b949e">• GetLastInputInfo 追踪真实键鼠活跃时长</text>
  <text x="34" y="295" font-size="10" fill="#8b949e">• 锁屏或离席 ≥ 5 分钟自动清零重新计时</text>
  <text x="34" y="312" font-size="9.5" font-weight="600" fill="#4ade80">✓ 外置双语护腰动作库 config/actions.json</text>

  <!-- Column 2 Cards -->
  <rect x="320" y="74" width="280" height="78" rx="10" fill="#0d1117" stroke="rgba(96,165,250,0.6)" stroke-width="1.3" />
  <text x="332" y="93" font-size="11.5" font-weight="700" fill="#f0f6fc">原子文件收件箱（零监听端口）</text>
  <text x="332" y="110" font-size="10" fill="#8b949e">• %LOCALAPPDATA%\AgentIsland\inbox\*.json</text>
  <text x="332" y="125" font-size="10" fill="#8b949e">• 64 KB Watcher 缓冲 + 80ms 突发合批防抖</text>
  <text x="332" y="141" font-size="9.5" font-weight="600" fill="#4ade80">✓ 30 并发 Agent 84–154ms 全量吞入零丢包</text>

  <rect x="320" y="166" width="280" height="160" rx="10" fill="#0d1117" stroke="rgba(245,158,11,0.65)" stroke-width="1.4" />
  <text x="332" y="185" font-size="11.5" font-weight="700" fill="#f0f6fc">AgentIsland.exe（C# 原生透明宿主）</text>
  <text x="332" y="204" font-size="10" fill="#8b949e">• DirectComposition (dcomp.dll) + NoRedir</text>
  <text x="332" y="220" font-size="10" fill="#8b949e">• WebView2 CompositionController 固定画布</text>
  <text x="332" y="236" font-size="10" fill="#8b949e">• 30ms 动态 WS_EX_TRANSPARENT 像素级穿透</text>
  <text x="332" y="252" font-size="10" fill="#8b949e">• 审批卡点雷达 + mtime 零读缓存</text>
  <text x="332" y="268" font-size="10" fill="#8b949e">• 监听 last_user_view_time 已读自动归档</text>
  <text x="332" y="284" font-size="10" fill="#8b949e">• 自动避让截图工具与全屏录屏浮层</text>
  <text x="332" y="308" font-size="9.5" font-weight="600" fill="#fbbf24">✓ edgeMaxA = 0 · 0 px 零跳动 · Auto/中/EN</text>

  <!-- Column 3 Cards -->
  <rect x="640" y="74" width="256" height="90" rx="10" fill="#0d1117" stroke="rgba(96,165,250,0.65)" stroke-width="1.4" />
  <text x="652" y="93" font-size="11.5" font-weight="700" fill="#f0f6fc">左胶囊 · 纯净 Agent Plane</text>
  <text x="652" y="110" font-size="10" fill="#8b949e">• 78px 超窄待机 · 极简品牌 SVG 图标</text>
  <text x="652" y="125" font-size="10" fill="#8b949e">• L0–L3 四级注意力分流 + 3.5s 轮播条</text>
  <text x="652" y="140" font-size="10" fill="#8b949e">• 舰队模式 (&gt;5 并发) + 品牌一键快筛</text>
  <text x="652" y="155" font-size="9.5" font-weight="600" fill="#60a5fa">✓ 独立 Agent 右键菜单（全清/静音/语言）</text>

  <rect x="640" y="174" width="256" height="74" rx="10" fill="#0d1117" stroke="rgba(74,222,128,0.6)" stroke-width="1.3" />
  <text x="652" y="193" font-size="11.5" font-weight="700" fill="#f0f6fc">右独立环 · 护腰与计时空间</text>
  <text x="652" y="210" font-size="10" fill="#8b949e">• 30/45/50/60m 档位 + 暂休 1h + 打卡</text>
  <text x="652" y="225" font-size="10" fill="#8b949e">• 30s–120s 跟练倒计时（真暂停/继续）</text>
  <text x="652" y="240" font-size="9.5" font-weight="600" fill="#4ade80">✓ 零回弹悬停展开 · 倒计时免 AI 抢占</text>

  <rect x="640" y="258" width="256" height="68" rx="10" fill="#0d1117" stroke="rgba(245,158,11,0.65)" stroke-width="1.3" />
  <text x="652" y="277" font-size="11.5" font-weight="700" fill="#f0f6fc">无抖动直达会话闭环</text>
  <text x="652" y="294" font-size="10" fill="#8b949e">• IsIconic 守护（消除最大化缩放抖动）</text>
  <text x="652" y="310" font-size="10" fill="#fbbf24">• 真实标题 Ctrl+K 直达（拦截兜底占位词）</text>
</svg>
