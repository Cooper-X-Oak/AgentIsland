<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-label="AgentIsland 4-Tier Notification Attention Model">
  <defs>
    <marker id="arr-m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#8b949e" />
    </marker>
    <marker id="arr-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#60a5fa" />
    </marker>
    <marker id="arr-w" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#f59e0b" />
    </marker>
    <marker id="arr-e" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#ef4444" />
    </marker>
    <marker id="arr-s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#4ade80" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Outer Dark Card Frame (clean on both GitHub Light & Dark themes) -->
  <rect x="0" y="0" width="920" height="330" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Header -->
  <text x="20" y="27" font-size="13" font-weight="700" fill="#f0f6fc">AgentIsland — 4-Tier Attention Economy &amp; Auto-Collapse Pipeline</text>
  <rect x="774" y="13" width="126" height="20" rx="10" fill="rgba(34,197,94,0.14)" stroke="rgba(74,222,128,0.45)" stroke-width="1" />
  <text x="837" y="26.5" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">41/41 VERIFIED</text>

  <!-- 3 Swimlanes -->
  <rect x="14" y="42" width="222" height="272" rx="12" fill="#161b22" stroke="#262c36" stroke-width="1" />
  <text x="26" y="61" font-size="10" font-weight="700" fill="#8b949e" letter-spacing="0.4">01 · NOISE FILTER GATE</text>

  <rect x="250" y="42" width="400" height="272" rx="12" fill="#161b22" stroke="#262c36" stroke-width="1" />
  <text x="262" y="61" font-size="10" font-weight="700" fill="#8b949e" letter-spacing="0.4">02 · ATTENTION TIERS (L0 → L3)</text>

  <rect x="664" y="42" width="242" height="272" rx="12" fill="#161b22" stroke="#262c36" stroke-width="1" />
  <text x="676" y="61" font-size="10" font-weight="700" fill="#8b949e" letter-spacing="0.4">03 · COMPACT TICKER &amp; DECAY</text>

  <!-- Bezier Connectors -->
  <path d="M224,114 C244,114 244,98 262,98" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr-m)" />
  <path d="M224,218 C244,218 244,158 262,158" fill="none" stroke="#60a5fa" stroke-width="1.4" marker-end="url(#arr-p)" />
  <path d="M224,226 C244,226 244,218 262,218" fill="none" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#arr-w)" />
  <path d="M224,234 C244,234 244,278 262,278" fill="none" stroke="#ef4444" stroke-width="1.4" marker-end="url(#arr-e)" />

  <path d="M638,98 C656,98 656,112 676,112" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-m)" />
  <path d="M638,158 C656,158 656,124 676,124" fill="none" stroke="#60a5fa" stroke-width="1.4" marker-end="url(#arr-p)" />
  <path d="M638,218 C656,218 656,216 676,216" fill="none" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#arr-w)" />
  <path d="M638,278 C656,278 656,268 676,268" fill="none" stroke="#ef4444" stroke-width="1.4" marker-end="url(#arr-e)" />

  <!-- Column 1: Filter Gate -->
  <rect x="24" y="72" width="200" height="90" rx="10" fill="#0d1117" stroke="rgba(74,222,128,0.55)" stroke-width="1.3" />
  <text x="34" y="91" font-size="11.5" font-weight="700" fill="#f0f6fc">Block False Mid-Turn Stops</text>
  <text x="34" y="108" font-size="10" fill="#8b949e">• fullyIdle === false (bg tasks)</text>
  <text x="34" y="123" font-size="10" fill="#8b949e">• continuationActive === true</text>
  <text x="34" y="138" font-size="10" fill="#8b949e">• No write_file false-positives</text>
  <text x="34" y="153" font-size="9.5" font-weight="600" fill="#4ade80">✓ Downgraded to L0 (zero popup)</text>

  <rect x="24" y="174" width="200" height="128" rx="10" fill="#0d1117" stroke="rgba(96,165,250,0.55)" stroke-width="1.3" />
  <text x="34" y="193" font-size="11.5" font-weight="700" fill="#f0f6fc">Decision-Grade Extraction</text>
  <text x="34" y="211" font-size="10" fill="#8b949e">• Real title from annotations/*.pbtxt</text>
  <text x="34" y="226" font-size="10" fill="#8b949e">• Distill AI reply question/conclusion</text>
  <text x="34" y="241" font-size="10" fill="#8b949e">• Never echoes your own prompt</text>
  <text x="34" y="259" font-size="9.5" fill="#60a5fa">• Brand SVG glyphs: AGY / Claude</text>
  <text x="34" y="274" font-size="9.5" fill="#60a5fa">  / Codex / CLI (112–196 px pill)</text>
  <text x="34" y="291" font-size="9.5" font-weight="600" fill="#4ade80">✓ Know which session &amp; why fast</text>

  <!-- Column 2: L0..L3 -->
  <rect x="262" y="72" width="376" height="50" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <text x="274" y="91" font-size="11.5" font-weight="700" fill="#f0f6fc">L0 · Silent Running (working / bg tasks)</text>
  <text x="274" y="109" font-size="10" fill="#8b949e">No popup · No sound · Brand glyph + 3-bar wave in 168px pill</text>

  <rect x="262" y="132" width="376" height="50" rx="10" fill="#0d1117" stroke="rgba(96,165,250,0.65)" stroke-width="1.4" />
  <text x="274" y="151" font-size="11.5" font-weight="700" fill="#f0f6fc">L1 · Capsule Ticker (needs_reply / info)</text>
  <text x="274" y="169" font-size="10" fill="#60a5fa">Never steals focus! Stays collapsed, rotates every 3.5s (1/N)</text>

  <rect x="262" y="192" width="376" height="50" rx="10" fill="#0d1117" stroke="rgba(245,158,11,0.7)" stroke-width="1.4" />
  <text x="274" y="211" font-size="11.5" font-weight="700" fill="#f0f6fc">L2 · Glance Toast (needs_decision / error)</text>
  <text x="274" y="229" font-size="10" fill="#fbbf24">Expands 8s to glance → auto-collapses to glowing ticker pill</text>

  <rect x="262" y="252" width="376" height="50" rx="10" fill="#0d1117" stroke="rgba(239,68,68,0.75)" stroke-width="1.5" />
  <text x="274" y="271" font-size="11.5" font-weight="700" fill="#f0f6fc">L3 · Blocking Urgent (needs_approval / posture due)</text>
  <text x="274" y="289" font-size="10" fill="#f87171">Expands + chime · Collapses after 30s idle (never blocks forever)</text>

  <!-- Column 3: Ticker & Decay -->
  <rect x="676" y="72" width="218" height="104" rx="10" fill="#0d1117" stroke="rgba(96,165,250,0.55)" stroke-width="1.3" />
  <text x="688" y="91" font-size="11.5" font-weight="700" fill="#f0f6fc">Compact 3.5s Ticker Pill</text>
  <text x="688" y="109" font-size="10" fill="#8b949e">• Cycles alerts / sessions cleanly</text>
  <text x="688" y="124" font-size="10" fill="#8b949e">• Shows crisp 1/N queue badge</text>
  <text x="688" y="139" font-size="10" fill="#8b949e">• Hover expands active ticked item</text>
  <text x="688" y="154" font-size="10" fill="#8b949e">• Idle hover never blocks tabs</text>
  <text x="688" y="168" font-size="9.5" font-weight="600" fill="#4ade80">✓ Click-through around every pill</text>

  <rect x="676" y="188" width="218" height="114" rx="10" fill="#0d1117" stroke="rgba(74,222,128,0.55)" stroke-width="1.3" />
  <text x="688" y="207" font-size="11.5" font-weight="700" fill="#f0f6fc">Auto-Decay &amp; Auto-Read</text>
  <text x="688" y="225" font-size="10" fill="#8b949e">• L2 Toast: 8s idle → pill</text>
  <text x="688" y="240" font-size="10" fill="#8b949e">• L3 Urgent: 30s idle → pill</text>
  <text x="688" y="255" font-size="10" fill="#8b949e">• Manual open: 60s idle → pill</text>
  <text x="688" y="270" font-size="10" fill="#4ade80">• Viewed in AGY → auto-cleared</text>
  <text x="688" y="288" font-size="9.5" fill="#8b949e">(Locked only during posture timer)</text>
</svg>
